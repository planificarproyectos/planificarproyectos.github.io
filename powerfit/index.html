<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}.cpanel{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:20px;background:var(--accent);color:var(--accent-ink)}
.cpanel h2{color:var(--accent-ink);font-size:20px}
.clab{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.7}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cbtn{position:relative;min-height:46px;padding:6px 4px;border-radius:12px;border:none;background:rgba(0,0,0,.13);color:var(--accent-ink);font:inherit;font-weight:700;font-size:13px;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center}
.cbtn.hoy{background:var(--accent-ink);color:var(--accent)}
.cbtn i{position:absolute;top:-7px;right:6px;font-style:normal;font-size:10px;font-weight:800;background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--accent-ink);border-radius:999px;padding:0 7px}

<style>
/* Layout: una columna tipo app móvil (máx 480px), navegación fija abajo; entreno a pantalla completa. */
:root{
  color-scheme: dark;
  --bg:#111315; --surface:#1C1F22; --surface2:#2A2E32; --line:#3A3F44;
  --fg:#F2F2EE; --muted:#A3A8AD; --dim:#767C82;
  --accent:#C6F432; --accent-ink:#111315; --accent-fg:#C6F432; --danger:#FF9B8A; --ok:#F2F2EE;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-mode="light"]{color-scheme:light;--bg:#F3F4F1;--surface:#FFFFFF;--surface2:#E8EBE5;--line:#CDD2CA;--fg:#15181A;--muted:#596066;--dim:#868D93;--danger:#C62828}
html,body{height:100%}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:6px 0;font-size:12px;color:var(--muted)}
.sw i{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#111315;box-shadow:0 0 0 2px var(--surface),0 0 0 4px transparent}
.sw[aria-checked="true"]{color:var(--fg);font-weight:700}
.sw[aria-checked="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--fg)}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);border:none;position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--accent-ink)}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 112px;display:flex;flex-direction:column;gap:22px}
.wrap.full{padding-block:14px 24px;min-height:100%}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;line-height:1.02;text-wrap:balance}
h1{font-size:34px}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.5px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}

.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;white-space:nowrap}
.pill svg{color:var(--accent-fg)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.dot{width:36px;height:36px;margin:0 auto;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent-ink)}
.dot.on{background:var(--accent)}
.dot.today{background:transparent;border:2px dashed var(--accent-fg)}
.dot.today.on{background:var(--accent);border:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--accent-fg) transparent;cursor:grab;-webkit-overflow-scrolling:touch}
.chips.scroll.drag{cursor:grabbing;user-select:none}
.chips.scroll .chip{flex-shrink:0}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:14px;white-space:nowrap}
.chip.sm{min-height:36px;padding:0 14px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

.btn{min-height:52px;border-radius:16px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.ghost{background:transparent;border:2px solid var(--accent-fg);color:var(--accent-fg)}
.btn.soft{background:var(--surface);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn.sm{width:34px;height:34px}
.link{background:none;border:none;color:var(--muted);font-weight:700;font-size:14px;min-height:44px;padding:0 6px}
.link:hover{color:var(--fg)}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;border:none;text-align:left;width:100%}
.hero .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.hero h3{font-size:30px}
.hero .go{width:48px;height:48px;border-radius:50%;background:var(--accent-ink);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.card{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:none;text-align:left;width:100%}
.card h3{font-size:21px}
.card .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.panel{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}

.mini{width:52px;height:52px;border-radius:12px;background:var(--surface2);flex-shrink:0;display:block}
.exrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 12px}
.exrow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.exrow b{font-size:15px}
.tag{font-size:12px;color:var(--muted)}
.check{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.libcard{background:var(--surface);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;border:none;text-align:left}
.libcard canvas{width:100%;aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--surface2);display:block}
.libcard b{font-size:14px;line-height:1.25}

.sel{display:flex;flex-direction:column;gap:10px}
.selitem{background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:10px;padding:3px}
.stepper button{width:32px;height:32px;border:none;border-radius:8px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.stepper span{min-width:58px;text-align:center;font-weight:700;font-size:14px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;min-height:48px;color:var(--muted)}
.field input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--fg);font-size:15px;min-height:46px}
.field:focus-within{outline:2px solid var(--accent-fg)}
.sticky{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--bg);padding-block:10px 4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:72px}
nav.tabs button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500}
nav.tabs button.on{color:var(--accent-fg);font-weight:700}

/* Entreno */
.wtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stage{position:relative;background:var(--surface);border-radius:24px;aspect-ratio:1/0.82;max-width:100%;overflow:hidden}
.stage canvas{width:100%;height:100%;display:block}
.views2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.views2 .view{position:relative;background:var(--surface);border-radius:20px;overflow:hidden;aspect-ratio:1/1.15;max-width:100%}
.views2 canvas{width:100%;height:100%;display:block}
.vtag{position:absolute;left:10px;top:10px;background:var(--bg);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent-fg)}
.views2 .eq{position:absolute;right:10px;bottom:10px;background:var(--bg);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--muted)}
.stage .eq{position:absolute;left:12px;bottom:12px;background:var(--bg);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--accent-fg)}
.sets{display:flex;gap:8px}
.sets>div{flex:1;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}
.counter{display:flex;align-items:baseline;justify-content:center;gap:8px;padding-block:6px}
.counter b{font-family:var(--f-display);font-size:84px;line-height:1;color:var(--accent-fg)}
.counter span{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--muted)}
.tapbtn{min-height:72px;border-radius:22px;font-size:19px}
.ctl{display:flex;gap:12px}
.ctl .icon-btn{width:72px;height:72px;border-radius:22px;background:transparent;border:1px solid var(--line)}
.rest{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.rest b.t{font-family:var(--f-display);font-size:72px;line-height:1}
.ask{background:var(--surface2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* Progreso */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface);border-radius:14px;padding:4px}
.seg button{min-height:40px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:32px;line-height:1}
.kpi:first-child b{color:var(--accent-fg)}
.kpi span{font-size:12px;color:var(--muted)}
.chart{height:170px;display:grid;gap:6px;align-items:end}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.chart .v{font-size:10px;color:var(--muted)}
.chart .b{width:100%;border-radius:6px;background:var(--accent);min-height:4px}
.chart .b.z{background:var(--surface2)}
.chart .l{font-size:11px;color:var(--muted);white-space:nowrap}
.chart .l.cur{color:var(--fg);font-weight:700}
.zone{display:flex;flex-direction:column;gap:6px}
.hist{display:flex;align-items:center;gap:10px;padding-block:8px;border-top:1px solid var(--surface2)}
.hist:first-of-type{border-top:none}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.installbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;width:calc(100% - 32px);max-width:448px;background:var(--surface);border:1px solid var(--accent-fg);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;animation:ib-in .35s ease-out}
.installbar.low{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.installbar ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
@keyframes ib-in{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} .installbar{animation:none} }
/* Bienvenida animada */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash svg{width:min(44vw,190px);height:auto;overflow:visible}
#splash .db{transform-box:fill-box;transform-origin:50% 50%;animation:sp-lift .9s cubic-bezier(.2,.9,.3,1.25) .05s both}
#splash .bolt{transform-box:fill-box;transform-origin:50% 0;animation:sp-bolt .38s cubic-bezier(.5,0,.75,0) .8s both, sp-glow 1.2s ease-in-out 1.2s infinite alternate}
#splash .flash{transform-box:fill-box;transform-origin:50% 50%;animation:sp-flash .6s ease-out 1.12s both}
#splash .word{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,9vw,44px);letter-spacing:3px;line-height:1;color:var(--fg);animation:sp-word .5s ease-out 1.3s both}
#splash .word span{color:var(--accent-fg)}
@keyframes sp-lift{0%{opacity:0;transform:translateY(60px) scale(.85)}60%{opacity:1;transform:translateY(-10px) scale(1.02)}80%{transform:translateY(3px)}100%{opacity:1;transform:none}}
@keyframes sp-bolt{0%{opacity:0;transform:translateY(-140%) scaleY(1.3)}100%{opacity:1;transform:none}}
@keyframes sp-flash{0%{opacity:0;transform:scale(.2)}1%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}
@keyframes sp-glow{from{filter:drop-shadow(0 0 0 rgba(198,244,50,0))}to{filter:drop-shadow(0 0 10px rgba(198,244,50,.75))}}
@keyframes sp-word{from{opacity:0;transform:translateY(12px);letter-spacing:10px}to{opacity:1;transform:none;letter-spacing:3px}}
#splash.replay .db,#splash.replay .bolt,#splash.replay .flash,#splash.replay .word{animation-name:none}
@media (prefers-reduced-motion: reduce){#splash *{animation:none!important}}

</style>

</head>

function daySet(){ var o={}; S.sessions.forEach(function(s){o[s.d]=1;}); return o; }
function streak(){ var ds=daySet(), d=new Date(), n=0; if(!ds[dk(d)]) d=addD(d,-1);
  while(ds[dk(d)]){ n++; d=addD(d,-1); } return n; }
function zoneSets(from,to){ var z={}; S.sessions.forEach(function(s){ if(s.ts>=from&&s.ts<to) for(var k in (s.zones||{})) z[k]=(z[k]||0)+s.zones[k]; }); return z; }
function seedRand(seed){ var x=seed%2147483647; if(x<=0)x+=2147483646; return function(){ x=x*16807%2147483647; return (x-1)/2147483646; }; }
function genRoutine(zones){
  var full=zones.length===ZONES.length, want=full?['Pecho','Espalda','Hombros','Brazos','Abdomen','Piernas','Glúteos']:zones;
  var rnd=seedRand(Number(dk(new Date()).replace(/-/g,''))), per=full?1:Math.max(1,Math.round(6/want.length)), out=[];
  want.forEach(function(z){
    var pool=EX_LIST.filter(function(e){return avail(e) && e.z[0]===z && out.indexOf(e.id)<0;});
    var more=EX_LIST.filter(function(e){return avail(e) && e.z[0]!==z && e.z.indexOf(z)>=0 && out.indexOf(e.id)<0;});
    pool.sort(function(){return rnd()-.5;}); more.sort(function(){return rnd()-.5;});
    pool.concat(more).slice(0,per).forEach(function(e){ out.push(e.id); });
  });
  var byZ=want.map(function(z){ return out.filter(function(id){ return EX[id].z.indexOf(z)>=0; }); }), rr=[], seen={};
  for(var k=0;k<8;k++) byZ.forEach(function(L){ var id=L[k]; if(id&&!seen[id]){ seen[id]=1; rr.push(id); } });
  out.forEach(function(id){ if(!seen[id]){ seen[id]=1; rr.push(id); } }); out=rr.slice(0,8);
  var n=full?'Cuerpo completo de hoy':'Rutina de '+want.join(' + ').toLowerCase();
  return {id:'gen',n:n,lvl:'A tu medida',items:out.map(itemOf),gen:true};
}

  var doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,1))/864e5), best=null,bs=Infinity;
  var L=recsFor(); if(!L.length) L=[adapt(RECS[0])];
  L.forEach(function(r,i){ var sc=0; r.items.forEach(function(it){ sc+=(z[EX[it.id].z[0]]||0); });
    sc=sc/r.items.length + ((i+doy)%L.length)*0.001 + (r.miss?0.5:0); if(sc<bs){bs=sc;best=r;} });
  return {r:best,why:had?'Trabaja lo que menos has entrenado esta semana':'Para ti'};
}

/* Entreno */
function vWork(){
  var w=S.w, it=w.items[w.ei], e=EX[it.id], rest=w.phase==='rest';
  var sets=''; for(var i=0;i<it.s;i++){ var pct=0, lg=w.log[w.ei][i];
    if(lg!=null) pct=100; else if(i===w.si&&!rest) pct=it.t?(1-w.tLeft/it.t)*100:Math.min(100,w.count/it.r*100);
    sets+='<div><div class="bar"><i style="width:'+Math.round(pct)+'%"></i></div><span class="tag">Serie '+(i+1)+'</span></div>'; }
  var ask=S.ask==='exit'?'<div class="ask"><b>¿Salir sin guardar este entreno?</b><div class="btns"><button class="btn soft" data-a="cancelAsk">Seguir</button><button class="btn danger" data-a="exitW">Salir</button></div></div>':'';
  var body;
  if(rest){
    body='<div class="rest"><span class="label">Descanso</span><b class="t num" id="restLeft">'+mmss((w.restEnd-Date.now())/1000)+'</b>'+
      '<span class="muted">Sigue: <b style="color:var(--fg)">'+esc(e.n)+'</b> · serie '+(w.si+1)+' de '+it.s+'</span>'+
      '<div class="btns" style="width:100%"><button class="btn soft" data-a="rest15">+15 s</button><button class="btn" data-a="skipRest">Saltar descanso</button></div></div>';
  } else if(it.t){
    body='<div class="counter"><b class="num" id="tleft">'+Math.ceil(w.tLeft)+'</b><span>/ '+it.t+' seg</span></div>'+
      '<button class="btn tapbtn" data-a="timer">'+(w.running?ic('pause',22,2.6)+'Pausar':ic('play',20)+'Iniciar '+it.t+' s')+'</button>'+
      '<div class="between"><button class="link" data-a="endSet">Terminar serie</button><button class="link" data-a="skipEx">Saltar ejercicio</button></div>';
  } else {
    body='<div class="counter"><b class="num">'+w.count+'</b><span>/ '+it.r+' reps</span></div>'+
      '<div class="ctl" style="align-items:center;justify-content:center"><button class="icon-btn" data-a="undo" aria-label="Una repetición menos" style="width:56px;height:56px">'+ic('minus',24)+'</button>'+
      '<span class="muted small" style="text-align:center;min-width:120px">Repeticiones hechas<br>en esta serie</span>'+
      '<button class="icon-btn" data-a="plus" aria-label="Una repetición más" style="width:56px;height:56px">'+ic('plus',24)+'</button></div>'+
      '<button class="btn tapbtn" data-a="endSet">'+ic('check',24,3)+'Terminar serie '+(w.si+1)+' de '+it.s+'</button>'+
      '<div class="between"><span></span><button class="link" data-a="skipEx">Saltar ejercicio</button></div>';
  }
  return '<div class="wrap full">'+
   '<div class="wtop"><button class="icon-btn" data-a="ask" data-v="exit" aria-label="Salir del entreno">'+ic('close')+'</button>'+
   '<span class="muted small num">Ejercicio '+(w.ei+1)+' de '+w.items.length+' · <b id="elapsed" style="color:var(--fg)">'+mmss((Date.now()-w.start)/1000)+'</b></span>'+
   '<button class="link" data-a="finish">Finalizar</button></div>'+ask+
   views(e)+
   '<div class="stack" style="gap:4px"><h1>'+esc(e.n)+'</h1><p class="muted">'+esc(e.c)+'</p></div>'+

/* Progreso */
function periodRange(){
  var now=new Date(), o=S.pOff, b=[], from, to, label, prevLabel;
  if(S.period==='week'){ from=addD(monday(now),7*o); to=addD(from,7);
    for(var i=0;i<7;i++){ var d=addD(from,i); b.push({l:DL[i],f:d.getTime(),t:addD(d,1).getTime(),cur:dk(d)===dk(now)}); }
    var e=addD(to,-1); label=from.getDate()+' '+MES[from.getMonth()]+' – '+e.getDate()+' '+MES[e.getMonth()]+' '+e.getFullYear(); prevLabel='la semana anterior';
  } else if(S.period==='month'){ from=new Date(now.getFullYear(),now.getMonth()+o,1); to=new Date(from.getFullYear(),from.getMonth()+1,1);
    for(var w=0;w<5;w++){ var f=new Date(from.getFullYear(),from.getMonth(),1+w*7), t=w===4?to:new Date(from.getFullYear(),from.getMonth(),8+w*7);
      if(f>=to) break; b.push({l:'Sem '+(w+1),f:f.getTime(),t:t.getTime(),cur:now>=f&&now<t}); }
    label=MESL[from.getMonth()]+' '+from.getFullYear(); prevLabel='el mes anterior';
  } else if(S.period==='sem'){ var sm=now.getMonth()<6?0:6; from=new Date(now.getFullYear(),sm+6*o,1); to=new Date(from.getFullYear(),from.getMonth()+6,1);
    for(var m=0;m<6;m++){ var f2=new Date(from.getFullYear(),from.getMonth()+m,1), t2=new Date(from.getFullYear(),from.getMonth()+m+1,1);
      b.push({l:MES[f2.getMonth()],f:f2.getTime(),t:t2.getTime(),cur:now>=f2&&now<t2}); }
    label=(from.getMonth()===0?'1.er':'2.º')+' semestre '+from.getFullYear(); prevLabel='el semestre anterior';
  } else { from=new Date(now.getFullYear()+o,0,1); to=new Date(from.getFullYear()+1,0,1);
    for(var y=0;y<12;y++){ var f3=new Date(from.getFullYear(),y,1), t3=new Date(from.getFullYear(),y+1,1);
      b.push({l:MES[y].charAt(0).toUpperCase(),f:f3.getTime(),t:t3.getTime(),cur:now>=f3&&now<t3}); }
    label='Año '+from.getFullYear(); prevLabel='el año anterior'; }
  return {from:from.getTime(),to:to.getTime(),b:b,label:label,prevLabel:prevLabel,len:to.getTime()-from.getTime()};
}
function vProgress(){
  var R=periodRange(), ses=S.sessions.filter(function(s){return s.ts>=R.from&&s.ts<R.to;});
  var min=0,reps=0; ses.forEach(function(s){min+=s.sec/60;reps+=s.reps;});
  var prevN=0; if(S.period==='week'||S.period==='year'){ var pf=S.period==='week'?R.from-7*864e5:new Date(new Date(R.from).getFullYear()-1,0,1).getTime();
    prevN=S.sessions.filter(function(s){return s.ts>=pf&&s.ts<R.from;}).length; }
  else { var pd=new Date(R.from); pd.setMonth(pd.getMonth()-(S.period==='month'?1:6)); prevN=S.sessions.filter(function(s){return s.ts>=pd.getTime()&&s.ts<R.from;}).length; }
  var vals=R.b.map(function(k){ var m=0; ses.forEach(function(s){ if(s.ts>=k.f&&s.ts<k.t) m+=s.sec/60; }); return Math.round(m); });
  var mx=Math.max.apply(null,vals.concat([1]));
  var chart='<div class="chart" style="grid-template-columns:repeat('+R.b.length+',minmax(0,1fr))">'+R.b.map(function(k,i){
    var hgt=vals[i]?Math.max(6,Math.round(vals[i]/mx*120)):4;
    return '<div class="col"><span class="v num">'+(vals[i]||'')+'</span><div class="b'+(vals[i]?'':' z')+'" style="height:'+hgt+'px"></div><span class="l'+(k.cur?' cur':'')+'">'+k.l+'</span></div>'; }).join('')+'</div>';
  var z=zoneSets(R.from,R.to), tot=0; for(var k in z) tot+=z[k];
  var zones=Object.keys(z).sort(function(a,b){return z[b]-z[a];}).map(function(n){ var p=Math.round(z[n]/tot*100);
    return '<div class="zone"><div class="between small"><span>'+n+'</span><span class="muted num">'+p+'% · '+z[n]+' series</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'; }).join('');
  var hist=ses.slice().reverse().slice(0,10).map(function(s){ var d=new Date(s.ts);
    var conf=S.ask==='del:'+s.id;
    return '<div class="hist"><button class="grow" data-a="sEdit" data-v="'+s.id+'" style="flex:1;min-width:0;background:none;border:none;text-align:left;padding:0"><b>'+esc(s.n)+' <span class="muted" style="font-weight:400">· editar</span></b><div class="muted small num">'+DIA[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MES[d.getMonth()]+' · '+Math.max(1,Math.round(s.sec/60))+' min · '+s.reps+' reps</div></button>'+
      (conf?'<button class="link" data-a="cancelAsk">No</button><button class="link" style="color:var(--danger)" data-a="delS" data-v="'+s.id+'">Borrar</button>'
           :'<button class="icon-btn sm" data-a="ask" data-v="del:'+s.id+'" aria-label="Borrar sesión">'+ic('trash',16)+'</button>')+'</div>'; }).join('');
  var seg=[['week','Semana'],['month','Mes'],['sem','Semestre'],['year','Año']].map(function(p){
    return '<button class="'+(S.period===p[0]?'on':'')+'" data-a="period" data-v="'+p[0]+'">'+p[1]+'</button>'; }).join('');
  var empty=!S.sessions.length?'<div class="empty"><b>Tu progreso aparecerá aquí</b><span class="muted small">Cada entreno que termines suma sesiones, minutos, repeticiones y zonas trabajadas, por semana, mes, semestre y año.</span><button class="btn" data-a="tab" data-v="home" style="width:auto">Hacer mi primer entreno</button></div>':'';
  return '<div class="wrap">'+head('Progreso')+'<div class="seg" role="tablist">'+seg+'</div>'+
   '<div class="between"><button class="icon-btn" data-a="pOff" data-v="-1" aria-label="Periodo anterior">'+ic('chevL')+'</button><b>'+R.label+'</b>'+
   '<button class="icon-btn" data-a="pOff" data-v="1" aria-label="Periodo siguiente"'+(S.pOff>=0?' disabled style="opacity:.35"':'')+'>'+ic('chevR')+'</button></div>'+empty+
   '<div class="kpis"><div class="kpi"><b class="num">'+ses.length+'</b><span>Sesiones</span></div><div class="kpi"><b class="num">'+Math.round(min)+'</b><span>Minutos</span></div><div class="kpi"><b class="num">'+reps+'</b><span>Repeticiones</span></div></div>'+
   '<p class="muted small">'+prevN+' sesiones en '+R.prevLabel+' · racha actual: '+streak()+' días</p>'+
   '<div class="panel"><b class="small">Minutos entrenados</b>'+chart+'</div>'+
   '<div class="panel"><b class="small">Zonas trabajadas</b>'+(zones||'<span class="muted small">Sin entrenos en este periodo.</span>')+'</div>'+
   '<button class="btn ghost" data-a="sNew">'+ic('plus',18,2.4)+'Registrar entreno pasado</button>'+
   (hist?'<div class="panel"><b class="small">Sesiones · toca una para editarla</b><div>'+hist+'</div></div>':'')+
   (S.local?'<p class="muted small">Tu historial se guarda en este navegador.</p>':'')+
   '</div>';
}


/* Editar sesión */
function sessCalc(ex){ var reps=0,hold=0,sets=0,zones={};
  ex.forEach(function(x){ var e=EX[x.id]; if(!e) return; var done=x.log.filter(function(v){return v!=null&&v>0;}); sets+=done.length;
    done.forEach(function(v){ if(e.t) hold+=v; else reps+=v; }); if(done.length) e.z.forEach(function(z){ zones[z]=(zones[z]||0)+done.length; }); });
  return {reps:reps,hold:hold,sets:sets,zones:zones}; }
function vSedit(){
  var x=S.se; if(!x) return vProgress();
  var exs=x.ex.map(function(it,i){ var e=EX[it.id]; if(!e) return '';
    var rows=it.log.map(function(v,j){ return '<div class="between small"><span class="muted">Serie '+(j+1)+'</span><span class="row" style="gap:6px"><span class="stepper"><button data-a="seStep" data-v="'+i+'" data-j="'+j+'" data-d="-'+(e.t?5:1)+'" aria-label="Menos">'+ic('minus',14)+'</button><span class="num">'+(v||0)+(e.t?' seg':' reps')+'</span><button data-a="seStep" data-v="'+i+'" data-j="'+j+'" data-d="'+(e.t?5:1)+'" aria-label="Más">'+ic('plus',14)+'</button></span><button class="icon-btn sm" data-a="seDelSet" data-v="'+i+'" data-j="'+j+'" aria-label="Quitar serie">'+ic('close',14)+'</button></span></div>'; }).join('');
    return '<div class="selitem"><div class="between"><b>'+esc(e.n)+'</b><button class="icon-btn sm" data-a="seDelEx" data-v="'+i+'" aria-label="Quitar ejercicio">'+ic('trash',16)+'</button></div>'+rows+
      '<button class="link" data-a="seAddSet" data-v="'+i+'" style="align-self:flex-start;color:var(--accent-fg)">+ Agregar serie</button></div>'; }).join('');
  var pick='';
  if(S.sePick){ var q=(S.seQ||'').toLowerCase();
    var list=EX_LIST.filter(function(e){ return !q||e.n.toLowerCase().indexOf(q)>=0; }).slice(0,40);
    pick='<div class="panel"><div class="between"><b class="small">Agregar ejercicio</b><button class="link" data-a="sePickX">Cerrar</button></div><label class="field" for="seQ">'+ic('search',18)+'<input id="seQ" type="text" placeholder="Buscar ejercicio" value="'+esc(S.seQ||'')+'"></label>'+
      list.map(function(e){ return '<button class="card" data-a="seAddEx" data-v="'+e.id+'" style="background:var(--surface2)"><span class="grow"><b>'+esc(e.n)+'</b><span class="muted small">'+e.z[0]+' · '+EQ[e.eq]+'</span></span>'+ic('plus',18)+'</button>'; }).join('')+'</div>'; }
  var c=sessCalc(x.ex);

/* ---------- Entreno: lógica ---------- */
var wake=null, actx=null;

/* ---------- Continuidad: el entreno y la pantalla sobreviven a recargas y cierres ---------- */
var STALE=6*3600e3, PV={home:1,routines:1,lib:1,progress:1,account:1,builder:1,detail:1,ex:1,work:1};
var Act={uid:null,t:null,lastRemote:0,
  key:function(){ return 'powerfit:state:'+(this.uid||'local'); },
  snap:function(){
    var w=S.w?JSON.parse(JSON.stringify(S.w)):null;
    if(w&&w.running){ w.tLeft=Math.max(0,(w.endAt-Date.now())/1000); w.running=false; }
    return {upd:Date.now(),view:PV[S.view]?S.view:'home',w:w,builder:S.builder||null,detail:S.view==='detail'?S.detail:null,ex:S.view==='ex'?S.ex:null};
  },
  persist:function(now){
    if(!this.ready||S.view==='auth'||S.view==='done') return;
    var st=this.snap(), self=this;
    try{ localStorage.setItem(this.key(),JSON.stringify(st)); }catch(e){}
    clearTimeout(this.t);
    var push=function(){ if(Store.mode==='db'&&Store.col) Store.col.doc('active').set(st.w?{upd:st.upd,w:st.w}:{upd:st.upd,w:null}).catch(function(){}); };
    if(now) push(); else this.t=setTimeout(push,1500);
  },
  read:function(){ try{ return JSON.parse(localStorage.getItem(this.key())||'null'); }catch(e){ return null; } },
  restore:function(uid,remote){
    this.uid=uid||null; this.ready=true;
    var st=this.read();
    if(remote&&remote.w&&(!st||remote.upd>(st.upd||0))) st={upd:remote.upd,view:'work',w:remote.w};
    if(!st) return;
    if(st.builder) S.builder=st.builder;
    if(st.w){
      var w=st.w; w.running=false;
      if(Date.now()-st.upd>STALE){ S.pendingW=w; S.pendingUpd=st.upd; S.view='home'; }
      else { S.w=w; S.view='work'; wakeOn(); }
    } else if(st.view==='builder'&&S.builder) S.view='builder';
    else if(st.view==='detail'&&st.detail){ S.detail=st.detail; S.view='detail'; }
    else if(st.view==='ex'&&st.ex&&EX[st.ex]){ S.ex=st.ex; S.view='ex'; }
    else if(PV[st.view]&&st.view!=='work') S.view=st.view;
    S.prev='home';
  }
};
function wakeOn(){ try{ navigator.wakeLock&&navigator.wakeLock.request('screen').then(function(l){wake=l;}).catch(function(){}); }catch(e){} }

function startW(r){
  var items=r.items.map(function(i){return {id:i.id,s:i.s,r:i.r,t:i.t};});
  S.w={n:r.n,combo:r.combo||null,items:items,ei:0,si:0,count:items[0].r||0,log:items.map(function(i){var a=[];for(var k=0;k<i.s;k++)a.push(null);return a;}),start:Date.now(),phase:'work',restEnd:0,tLeft:items[0].t,running:false,endAt:0};

function curIt(){ return S.w.items[S.w.ei]; }
function completeSet(val){
  var w=S.w, it=curIt(); w.log[w.ei][w.si]=val; w.running=false;
  if(w.si<it.s-1){ w.si++; w.tLeft=it.t; w.count=it.r; restStart(); }
  else if(w.ei<w.items.length-1){ w.ei++; w.si=0; w.tLeft=curIt().t; w.count=curIt().r; restStart(); }
  else return finish();
  render();
}
function restStart(){ S.w.phase='rest'; S.w.restEnd=Date.now()+REST*1000; }
function skipEx(){ var w=S.w; w.running=false; w.phase='work';
  if(w.ei<w.items.length-1){ w.ei++; w.si=0; w.tLeft=curIt().t; w.count=curIt().r; render(); } else finish(); }
function finish(){
  var w=S.w, reps=0, hold=0, sets=0, zones={}, ex=[];
  w.items.forEach(function(it,i){ var e=EX[it.id], done=w.log[i].filter(function(v){return v!=null&&v>0;});
    if(!done.length) return; ex.push({id:it.id,log:w.log[i]}); sets+=done.length;
    done.forEach(function(v){ if(it.t) hold+=v; else reps+=v; });
    e.z.forEach(function(z){ zones[z]=(zones[z]||0)+done.length; }); });
  releaseWake();
  if(!sets){ S.w=null; Act.persist(true); toast('No registraste series, no se guardó nada.'); go('home'); return; }
  var now=new Date(), rec={id:'s'+now.getTime(),ts:now.getTime(),d:dk(now),n:w.n,combo:w.combo||null,sec:Math.round((now-w.start)/1000),reps:reps,hold:hold,sets:sets,zones:zones,ex:ex};
  Store.addSession(rec); S.last=rec; S.w=null; Act.persist(true); beep(660,.12); setTimeout(function(){beep(990,.2);},140); go('done');
}
function releaseWake(){ try{ wake&&wake.release(); }catch(e){} wake=null; }
setInterval(function(){
  var w=S.w; if(S.view!=='work'||!w) return;
  var el=document.getElementById('elapsed'); if(el) el.textContent=mmss((Date.now()-w.start)/1000);
  if(w.phase==='rest'){ var left=(w.restEnd-Date.now())/1000;
    if(left<=0){ w.phase='work'; beep(880,.25); render(); return; }
    var rl=document.getElementById('restLeft'); if(rl) rl.textContent=mmss(left);
  } else if(w.running){ w.tLeft=Math.max(0,(w.endAt-Date.now())/1000);
    var tl=document.getElementById('tleft'); if(tl) tl.textContent=Math.ceil(w.tLeft);
    if(w.tLeft<=0){ beep(880,.25); completeSet(curIt().t); } }
},250);

function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},2600); }
var A={
  tab:function(v){ go(v); if(v==='account'&&S.isAdmin&&!S.adm) admLoad(); },
  back:function(){ go(S.prev&&S.prev!==S.view&&S.prev!=='work'&&S.prev!=='done'?S.prev:'home'); },
  zone:function(v){ var i=S.zones.indexOf(v); if(i>=0) S.zones.splice(i,1); else S.zones.push(v); render(); },
  zoneAll:function(){ S.zones=S.zones.length===ZONES.length?[]:ZONES.slice(); render(); },
  combo:function(v){ var c=COMBOS.filter(function(x){return x.id===v;})[0]; if(!c) return; S.detail=genCombo(c); go('detail'); },
  gen:function(){ if(!S.zones.length) return; S.detail=genRoutine(S.zones); go('detail'); },
  openRec:function(v){ S.detail=findRoutine(v); go('detail'); },
  start:function(){ startW(S.detail); },
  editDetail:function(){ var r=S.detail, custom=S.routines.some(function(x){return x.id===r.id;});
    S.builder={id:custom?r.id:null,n:custom?r.n:(r.gen?'':r.n+' (mía)'),items:r.items.map(function(i){return {id:i.id,s:i.s,r:i.r,t:i.t};})};
    S.bQ=''; S.bZone='Todos'; go('builder'); },
  delRoutine:function(){ var id=S.detail.id; S.routines=S.routines.filter(function(r){return r.id!==id;}); Store.saveRoutines(); toast('Rutina eliminada'); go('routines'); },
  newBuilder:function(){ S.builder={id:null,n:'',items:[]}; S.bQ=''; S.bZone='Todos'; go('builder'); },
  bZone:function(v){ S.bZone=v; document.querySelectorAll('[data-a="bZone"]').forEach(function(b){ b.classList.toggle('on',b.dataset.v===v); }); renderBLib(); },
  tog:function(v){ var it=S.builder.items, i=it.map(function(x){return x.id;}).indexOf(v); if(i>=0) it.splice(i,1); else it.push(itemOf(v)); keep(render); },
  rm:function(v){ S.builder.items.splice(+v,1); keep(render); },
  mv:function(v,el){ var it=S.builder.items, i=+v, j=i+(+el.dataset.d); if(j<0||j>=it.length) return; var t=it[i]; it[i]=it[j]; it[j]=t; keep(render); },
  st:function(v,el){ var x=S.builder.items[+v], k=el.dataset.k, d=+el.dataset.d, lim={s:[1,10],r:[1,100],t:[5,300]}[k];
    x[k]=Math.min(lim[1],Math.max(lim[0],x[k]+d)); keep(render); },
  saveB:function(){ var b=S.builder; if(!b.items.length) return;
    var n=(b.n||'').trim()||('Mi rutina '+(S.routines.length+1));
    var r={id:b.id||('u'+Date.now()),n:n,lvl:'Personal',items:b.items};
    var i=S.routines.map(function(x){return x.id;}).indexOf(r.id); if(i>=0) S.routines[i]=r; else S.routines.push(r);
    Store.saveRoutines(); S.builder=null; S.detail=r; toast('Rutina guardada'); S.prev='routines'; S.view='detail'; render(); },
  startB:function(){ var b=S.builder; if(!b.items.length) return; startW({n:(b.n||'').trim()||'Rutina libre',items:b.items}); },
  libZone:function(v){ S.libZone=v; render(); },
  openEx:function(v){ S.ex=v; go('ex'); },
  addToB:function(v){ if(!S.builder) S.builder={id:null,n:'',items:[]};
    if(!S.builder.items.some(function(i){return i.id===v;})) S.builder.items.push(itemOf(v));
    toast('Agregado a tu rutina'); S.prev='lib'; S.view='builder'; render(); window.scrollTo(0,0); },
  ask:function(v){ S.ask=v; render(); },
  cancelAsk:function(){ S.ask=null; render(); },
  exitW:function(){ S.w=null; releaseWake(); go('home'); Act.persist(true); },
  resumeP:function(){ S.w=S.pendingW; S.pendingW=null; S.w.running=false; wakeOn(); go('work'); Act.persist(true); },
  saveP:function(){ S.w=S.pendingW; S.pendingW=null; finish(); },
  dropP:function(){ S.pendingW=null; Act.persist(true); render(); toast('Entreno descartado'); },
  finish:function(){ finish(); },
  rep:function(){ var w=S.w, it=curIt(); w.count++; buzz(); beep(1200,.04);
    if(w.count>=it.r){ beep(880,.2); completeSet(w.count); } else render(); },
  undo:function(){ S.w.count=Math.max(0,S.w.count-1); render(); },
  plus:function(){ S.w.count=Math.min(999,S.w.count+1); buzz(); render(); },
  endSet:function(){ var w=S.w, it=curIt(); if(w.running) w.tLeft=Math.max(0,(w.endAt-Date.now())/1000);
    var v=it.t?Math.round(it.t-w.tLeft):w.count; buzz(); beep(880,.15); completeSet(v>0?v:0); },
  skipEx:function(){ skipEx(); },
  timer:function(){ var w=S.w; if(w.running){ w.tLeft=Math.max(0,(w.endAt-Date.now())/1000); w.running=false; } else { w.endAt=Date.now()+w.tLeft*1000; w.running=true; } render(); },
  rest15:function(){ S.w.restEnd+=15000; },
  skipRest:function(){ S.w.phase='work'; render(); },
  period:function(v){ S.period=v; S.pOff=0; S.ask=null; render(); },
  pOff:function(v){ var n=S.pOff+(+v); if(n>0) return; S.pOff=n; render(); },
  authMode:function(v){ var e=document.getElementById('aEmail'); if(e) S.authEmail=e.value; S.authMode=v; render(); },
  equipTog:function(v){ var o=owned().slice(), i=o.indexOf(v); if(i>=0) o.splice(i,1); else o.push(v); setEquip(o,true); keep(render); },
  equipGo:function(){ go('account'); setTimeout(function(){ var el=document.getElementById('equipSec'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },60); },
  libMine:function(){ S.libAll=!S.libAll; render(); },
  accent:function(v){ setTheme({accent:v},true); keep(render); },
  darkMode:function(){ setTheme({mode:PF_THEME.mode==='light'?'dark':'light'},true); keep(render); },
  instGo:function(){ var pr=Inst.prompt; if(!pr) return; pr.prompt(); (pr.userChoice||Promise.resolve({})).then(function(c){ if(c&&c.outcome==='accepted') Inst.prompt=null; else { try{ localStorage.setItem('powerfit:installDismiss',Date.now()); }catch(e){} } Inst.show(); if(S.view==='account') render(); }); },
  instNo:function(){ try{ localStorage.setItem('powerfit:installDismiss',Date.now()); }catch(e){} Inst.show(); },
  logout:function(){ if(Store.auth) Store.auth.signOut(); },
  resetPass:function(){ if(!Store.auth||!S.user) return; Store.auth.sendPasswordResetEmail(S.user.email,{url:"https://www.planificarproyectos.com/powerfit/"}).then(function(){ toast('Te enviamos un correo a '+S.user.email); },function(e){ toast(authErr(e)); }); },
  exportCsv:function(){ if(S.sessions.length) csvExport(); },
  wipe:function(){ S.ask=null; Store.wipe(); toast('Historial borrado'); render(); },
  admLoad:function(){ S.adm=null; render(); admLoad(); },
  admSet:function(v,el){ var st=el.dataset.s; S.ask=null;
    Store.fdb.collection('invitaciones').doc(v).set({estado:st},{merge:true}).then(function(){ toast(st==='revocado'?'Acceso revocado':'Acceso reactivado'); admLoad(); },function(){ toast('No se pudo cambiar el acceso.'); }); },
  sEdit:function(v){ var r=S.sessions.filter(function(x){return x.id===v;})[0]; if(!r) return; S.se=JSON.parse(JSON.stringify(r)); S.se.ex=S.se.ex||[]; S.sePick=false; go('sedit'); },
  sNew:function(){ S.se={isNew:true,id:'s'+Date.now(),n:'Entreno registrado',d:dk(new Date()),ts:Date.now(),sec:1800,ex:[]}; S.sePick=true; S.seQ=''; go('sedit'); },
  sePick:function(){ S.sePick=true; S.seQ=''; keep(render); },
  sePickX:function(){ S.sePick=false; keep(render); },
  seAddEx:function(v){ var e=EX[v], a=[]; for(var i=0;i<e.s;i++) a.push(e.t||e.r); S.se.ex.push({id:v,log:a}); S.sePick=false; keep(render); },
  seDelEx:function(v){ S.se.ex.splice(+v,1); keep(render); },
  seAddSet:function(v){ var x=S.se.ex[+v], e=EX[x.id], last=x.log.length?x.log[x.log.length-1]:(e.t||e.r); x.log.push(last||e.t||e.r); keep(render); },
  seDelSet:function(v,el){ var x=S.se.ex[+v]; x.log.splice(+el.dataset.j,1); if(!x.log.length) S.se.ex.splice(+v,1); keep(render); },
  seStep:function(v,el){ var x=S.se.ex[+v], j=+el.dataset.j; x.log[j]=Math.max(0,Math.min(999,(x.log[j]||0)+(+el.dataset.d))); keep(render); },
  seSave:function(){ var x=S.se, c=sessCalc(x.ex); if(!c.sets) return;
    var n=(document.getElementById('seN').value||'').trim()||'Entreno', d=document.getElementById('seD').value||x.d, m=+document.getElementById('seM').value||Math.round(x.sec/60);
    if(d>dk(new Date())) d=dk(new Date());
    var old=new Date(x.ts), p=d.split('-'), ts=(d===x.d)?x.ts:new Date(+p[0],+p[1]-1,+p[2],old.getHours(),old.getMinutes()).getTime();
    var rec={id:x.isNew?x.id:x.id,ts:ts,d:d,n:n,combo:x.combo||null,sec:Math.max(60,Math.round(m*60)),reps:c.reps,hold:c.hold,sets:c.sets,zones:c.zones,ex:x.ex,edited:true};
    if(x.isNew) Store.addSession(rec); else Store.updSession(x.id,rec);
    S.se=null; toast(x.isNew?'Entreno registrado':'Sesión actualizada'); S.prev='progress'; go('progress'); },
  delS:function(v){ Store.delSession(v); S.ask=null; toast('Sesión borrada'); render(); }
};
function keep(fn){ var y=window.scrollY; fn(); window.scrollTo(0,y); }
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]'); if(!el||el.disabled) return;
  audio(); var f=A[el.dataset.a]; if(f) f(el.dataset.v,el);
});
document.addEventListener('submit',function(ev){ if(ev.target.id==='authForm'){ ev.preventDefault(); authSubmit(); } });
document.addEventListener('input',function(ev){
  if(ev.target.id==='bname'&&S.builder) S.builder.n=ev.target.value;
  if(ev.target.id==='seQ'){ S.seQ=ev.target.value; var ps=ev.target.selectionStart; keep(render); var qi=document.getElementById('seQ'); if(qi){ qi.focus(); try{qi.setSelectionRange(ps,ps);}catch(e){} } }
  if(ev.target.id==='seN'&&S.se) S.se.n=ev.target.value;
  if(ev.target.id==='seD'&&S.se&&ev.target.value) S.se.d=ev.target.value;
  if(ev.target.id==='seM'&&S.se) S.se.sec=(+ev.target.value||1)*60;
  if(ev.target.id==='admQ'){ S.admQ=ev.target.value; var pos=ev.target.selectionStart; keep(render); var i=document.getElementById('admQ'); if(i){ i.focus(); try{i.setSelectionRange(pos,pos);}catch(e){} } }
  if(ev.target.id==='bq'){ S.bQ=ev.target.value; renderBLib(); }
});
document.addEventListener('keydown',function(ev){
  if(S.view!=='work'||!S.w||S.w.phase!=='work') return;
  if(ev.target.tagName==='INPUT'||ev.target.tagName==='BUTTON') return;
  if(ev.code==='Space'){ ev.preventDefault(); audio(); if(curIt().t) A.timer(); else A.endSet(); }
});
var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(setupCanvases,150); });



/* ---------- Instalar como app ---------- */
var Inst={prompt:null,
  standalone:function(){ try{ return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; }catch(e){ return false; } },
  ios:function(){ var u=navigator.userAgent||''; return /iphone|ipad|ipod/i.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); },
  can:function(){ return !this.standalone()&&(!!this.prompt||this.ios()); },
  dismissed:function(){ try{ return Date.now()-(+localStorage.getItem('powerfit:installDismiss')||0)<7*864e5; }catch(e){ return false; } },
  body:function(inBar){
    if(this.prompt) return '<div class="row">'+logo(40)+'<div class="stack" style="gap:2px;flex:1;min-width:0"><b>Instala PowerFit</b><span class="muted small">Ábrela desde tu pantalla de inicio, a pantalla completa y más rápido.</span></div></div>'+
      '<div class="btns">'+(inBar?'<button class="btn soft" data-a="instNo">Ahora no</button>':'')+'<button class="btn" data-a="instGo"'+(inBar?'':' style="grid-column:1/-1"')+'>Instalar</button></div>';
    return '<div class="row">'+logo(40)+'<div class="stack" style="gap:2px;flex:1;min-width:0"><b>Instala PowerFit en tu iPhone</b><span class="muted small">En Safari:</span></div></div>'+
      '<ol><li>Toca <b>Compartir</b> (el cuadro con la flecha hacia arriba).</li><li>Elige <b>Agregar a pantalla de inicio</b> y luego <b>Agregar</b>.</li></ol>'+
      (inBar?'<button class="btn soft" data-a="instNo">Entendido</button>':'');
  },
  show:function(){ var el=document.getElementById('install'); if(!el) return;
    var on=this.can()&&!this.dismissed()&&S.view!=='work'&&S.view!=='done'&&document.getElementById('splash').classList.contains('out');
    if(!on){ el.hidden=true; return; }
    el.innerHTML=this.body(true); el.classList.toggle('low',document.getElementById('nav').hidden); el.hidden=false; }
};
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); Inst.prompt=e; Inst.show(); if(S.view==='account') render(); });
window.addEventListener('appinstalled',function(){ Inst.prompt=null; document.getElementById('install').hidden=true; toast('PowerFit quedó instalada'); });
setTimeout(function(){ Inst.show(); },2700);

/* ---------- Bienvenida ---------- */
var splashT0=Date.now(), splashTimer=null;
function hideSplash(){ var el=document.getElementById('splash'); if(!el) return;
  clearTimeout(splashTimer); splashTimer=setTimeout(function(){ el.classList.add('out'); }, Math.max(0,2200-(Date.now()-splashT0))); }
function playSplash(){ var el=document.getElementById('splash'); if(!el) return;
  el.classList.remove('out'); el.classList.add('replay'); void el.offsetWidth; el.classList.remove('replay');
  splashT0=Date.now(); hideSplash(); }

/* ---------- Arranque ---------- */
try{ S.equip=JSON.parse(localStorage.getItem('powerfit:equip:local')||'null'); }catch(e){}
navInit(); Store.loadLocal(); Store.init(); if(!Store.auth) Act.restore(null); render(); requestAnimationFrame(loop); hideSplash();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ if(S.view!=='work') setupCanvases(); });
if("serviceWorker" in navigator) window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
})();

/* Deslizar chips con mouse: rueda y arrastre */
(function(){
  var el=null,x0=0,s0=0,moved=false;
  document.addEventListener('wheel',function(e){ var c=e.target.closest&&e.target.closest('.chips.scroll'); if(c&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){ c.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
  document.addEventListener('mousedown',function(e){ var c=e.target.closest&&e.target.closest('.chips.scroll'); if(!c) return; el=c; x0=e.clientX; s0=c.scrollLeft; moved=false; });
  document.addEventListener('mousemove',function(e){ if(!el) return; var d=e.clientX-x0; if(Math.abs(d)>4){ moved=true; el.classList.add('drag'); } if(moved) el.scrollLeft=s0-d; });
  document.addEventListener('mouseup',function(){ if(el) el.classList.remove('drag'); el=null; });
  document.addEventListener('click',function(e){ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);
})();
</script>
