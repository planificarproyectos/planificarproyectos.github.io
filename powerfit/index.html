<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PowerFit</title>
<meta name="description" content="Entrena en casa con mancuernas y tapete: rutinas por zona, ejercicios animados, botón para chulear repeticiones y progreso semanal, mensual, semestral y anual.">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PowerFit">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: una columna tipo app móvil (máx 480px), navegación fija abajo; entreno a pantalla completa. */
:root{
  color-scheme: dark;
  --bg:#111315; --surface:#1C1F22; --surface2:#2A2E32; --line:#3A3F44;
  --fg:#F2F2EE; --muted:#A3A8AD; --dim:#767C82;
  --accent:#C6F432; --accent-ink:#111315; --danger:#FF9B8A;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 112px;display:flex;flex-direction:column;gap:22px}
.wrap.full{padding-block:14px 24px;min-height:100%}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;line-height:1.02;text-wrap:balance}
h1{font-size:34px}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.5px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}

.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;white-space:nowrap}
.pill svg{color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.dot{width:36px;height:36px;margin:0 auto;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent-ink)}
.dot.on{background:var(--accent)}
.dot.today{background:transparent;border:2px dashed var(--accent)}
.dot.today.on{background:var(--accent);border:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:14px;white-space:nowrap}
.chip.sm{min-height:36px;padding:0 14px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

.btn{min-height:52px;border-radius:16px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.ghost{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn.soft{background:var(--surface);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn.sm{width:34px;height:34px}
.link{background:none;border:none;color:var(--muted);font-weight:700;font-size:14px;min-height:44px;padding:0 6px}
.link:hover{color:var(--fg)}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;border:none;text-align:left;width:100%}
.hero .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.hero h3{font-size:30px}
.hero .go{width:48px;height:48px;border-radius:50%;background:var(--accent-ink);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.card{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:none;text-align:left;width:100%}
.card h3{font-size:21px}
.card .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.panel{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}

.mini{width:52px;height:52px;border-radius:12px;background:var(--surface2);flex-shrink:0;display:block}
.exrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 12px}
.exrow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.exrow b{font-size:15px}
.tag{font-size:12px;color:var(--muted)}
.check{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.libcard{background:var(--surface);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;border:none;text-align:left}
.libcard canvas{width:100%;aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--surface2);display:block}
.libcard b{font-size:14px;line-height:1.25}

.sel{display:flex;flex-direction:column;gap:10px}
.selitem{background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:10px;padding:3px}
.stepper button{width:32px;height:32px;border:none;border-radius:8px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.stepper span{min-width:58px;text-align:center;font-weight:700;font-size:14px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;min-height:48px;color:var(--muted)}
.field input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--fg);font-size:15px;min-height:46px}
.field:focus-within{outline:2px solid var(--accent)}
.sticky{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--bg);padding-block:10px 4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:72px}
nav.tabs button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500}
nav.tabs button.on{color:var(--accent);font-weight:700}

/* Entreno */
.wtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stage{position:relative;background:var(--surface);border-radius:24px;aspect-ratio:1/0.82;max-width:100%;overflow:hidden}
.stage canvas{width:100%;height:100%;display:block}
.stage .eq{position:absolute;left:12px;bottom:12px;background:var(--bg);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--accent)}
.sets{display:flex;gap:8px}
.sets>div{flex:1;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}
.counter{display:flex;align-items:baseline;justify-content:center;gap:8px;padding-block:6px}
.counter b{font-family:var(--f-display);font-size:84px;line-height:1;color:var(--accent)}
.counter span{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--muted)}
.tapbtn{min-height:72px;border-radius:22px;font-size:19px}
.ctl{display:flex;gap:12px}
.ctl .icon-btn{width:72px;height:72px;border-radius:22px;background:transparent;border:1px solid var(--line)}
.rest{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.rest b.t{font-family:var(--f-display);font-size:72px;line-height:1}
.ask{background:var(--surface2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* Progreso */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface);border-radius:14px;padding:4px}
.seg button{min-height:40px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:32px;line-height:1}
.kpi:first-child b{color:var(--accent)}
.kpi span{font-size:12px;color:var(--muted)}
.chart{height:170px;display:grid;gap:6px;align-items:end}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.chart .v{font-size:10px;color:var(--muted)}
.chart .b{width:100%;border-radius:6px;background:var(--accent);min-height:4px}
.chart .b.z{background:var(--surface2)}
.chart .l{font-size:11px;color:var(--muted);white-space:nowrap}
.chart .l.cur{color:var(--fg);font-weight:700}
.zone{display:flex;flex-direction:column;gap:6px}
.hist{display:flex;align-items:center;gap:10px;padding-block:8px;border-top:1px solid var(--surface2)}
.hist:first-of-type{border-top:none}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }
</style>

</head>
<body>
<main id="app"></main>
<nav class="tabs" id="nav" aria-label="Secciones">
  <div class="in">
    <button data-a="tab" data-v="home" id="t-home"></button>
    <button data-a="tab" data-v="routines" id="t-routines"></button>
    <button data-a="tab" data-v="lib" id="t-lib"></button>
    <button data-a="tab" data-v="progress" id="t-progress"></button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';

var IP = {

  back:'M15 6l-6 6 6 6', close:'M6 6l12 12M18 6L6 18', check:'M5 12l5 5 9-10', plus:'M12 5v14M5 12h14',

  trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13', flame:'M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 2 3 4',
  chevL:'M15 6l-6 6 6 6', chevR:'M9 6l6 6-6 6', pause:'M8 5v14M16 5v14', search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4',

};

  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+IP[n]+'"/></svg>'; }
function logo(s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 200 200" role="img" aria-label="PowerFit"><g fill="#F2F2EE"><rect x="40" y="94" width="120" height="12" rx="4"/><rect x="26" y="62" width="20" height="76" rx="6"/><rect x="154" y="62" width="20" height="76" rx="6"/><rect x="12" y="78" width="12" height="44" rx="4"/><rect x="176" y="78" width="12" height="44" rx="4"/></g><path d="M112 22 L78 104 L100 104 L86 180 L128 88 L106 88 L122 22 Z" fill="#C6F432" stroke="#111315" stroke-width="6" stroke-linejoin="round"/></svg>'; }

/* ---------- Ejercicios ---------- */
var ZONES=['Pecho','Espalda','Hombros','Brazos','Abdomen','Piernas','Glúteos','Cardio'];
var EQ={mancuernas:'Mancuernas',tapete:'Tapete',ninguno:'Sin equipo'};
var EX_LIST=[
 ['flexiones','Flexiones',['Pecho','Brazos'],'tapete',3,10,0,'pushup','Cuerpo en línea recta; baja el pecho hasta casi tocar el tapete.'],

 ['aperturas','Aperturas en el suelo',['Pecho'],'mancuernas',3,12,0,'fly','Codos un poco flexionados; abre hasta que los brazos toquen el tapete.'],
 ['remo','Remo inclinado',['Espalda','Brazos'],'mancuernas',3,12,0,'row','Espalda recta e inclinada; lleva los codos hacia atrás.'],
 ['pajaros','Pájaros',['Espalda','Hombros'],'mancuernas',3,12,0,'row','Inclinado al frente; abre los brazos hacia los lados apretando la espalda.'],
 ['superman','Superman',['Espalda','Glúteos'],'tapete',3,12,0,'superman','Boca abajo; eleva brazos y piernas a la vez y sostén 1 segundo.'],
 ['rdl','Peso muerto rumano',['Piernas','Glúteos','Espalda'],'mancuernas',3,12,0,'rdl','Cadera hacia atrás y rodillas suaves; baja las mancuernas pegadas a las piernas.'],
 ['press-hombro','Press de hombros',['Hombros','Brazos'],'mancuernas',3,10,0,'press','Abdomen firme; empuja sobre la cabeza sin arquear la espalda.'],
 ['laterales','Elevaciones laterales',['Hombros'],'mancuernas',3,12,0,'lateral','Sube los brazos hasta la altura de los hombros y baja controlando.'],
 ['frontales','Elevaciones frontales',['Hombros'],'mancuernas',3,12,0,'front','Brazos casi rectos; sube al frente hasta la altura de los ojos.'],
 ['curl','Curl de bíceps',['Brazos'],'mancuernas',3,12,0,'curl','Codos pegados al torso; sube lento y baja en 2 segundos.'],
 ['curl-martillo','Curl martillo',['Brazos'],'mancuernas',3,12,0,'curl','Palmas mirándose entre sí durante todo el movimiento.'],
 ['triceps-nuca','Extensión de tríceps tras nuca',['Brazos'],'mancuernas',3,12,0,'ohext','Codos apuntando al techo; mueve solo los antebrazos.'],
 ['patada-triceps','Patada de tríceps',['Brazos'],'mancuernas',3,12,0,'kickback','Torso inclinado; extiende el brazo hacia atrás sin mover el codo.'],
 ['crunch','Abdominales crunch',['Abdomen'],'tapete',3,15,0,'crunch','Despega los hombros del tapete; la zona lumbar se queda abajo.'],
 ['bicicleta','Bicicleta',['Abdomen'],'tapete',3,20,0,'bike','Lleva el codo hacia la rodilla contraria, alternando.'],
 ['plancha','Plancha',['Abdomen','Hombros'],'tapete',3,0,30,'plank','Antebrazos bajo los hombros; glúteos y abdomen apretados.'],
 ['elev-piernas','Elevación de piernas',['Abdomen'],'tapete',3,12,0,'legraise','Piernas rectas; baja lento sin tocar el tapete.'],
 ['giro-ruso','Giro ruso',['Abdomen'],'mancuernas',3,20,0,'twist','Sentado e inclinado atrás; lleva la mancuerna a cada lado.'],
 ['escaladores','Escaladores',['Abdomen','Cardio'],'tapete',3,0,30,'climber','En posición de flexión, lleva las rodillas al pecho alternando rápido.'],
 ['sentadilla','Sentadilla goblet',['Piernas','Glúteos'],'mancuernas',3,12,0,'squat','Mancuerna al pecho; baja hasta que los muslos queden paralelos al piso.'],
 ['zancadas','Zancadas',['Piernas','Glúteos'],'mancuernas',3,10,0,'lunge','Paso largo; la rodilla trasera baja casi hasta el piso. Alterna piernas.'],
 ['sumo','Sentadilla sumo',['Piernas','Glúteos'],'mancuernas',3,12,0,'sumo','Piernas abiertas y puntas afuera; mancuerna colgando al centro.'],
 ['talones','Elevación de talones',['Piernas'],'mancuernas',3,15,0,'calf','Sube en puntas, pausa arriba y baja lento.'],
 ['puente','Puente de glúteo',['Glúteos','Piernas'],'tapete',3,15,0,'bridge','Empuja con los talones y aprieta los glúteos arriba.'],
 ['jacks','Saltos de tijera',['Cardio','Piernas'],'ninguno',3,0,40,'jacks','Abre piernas y brazos al mismo tiempo, a ritmo constante.']
].map(function(a){return {id:a[0],n:a[1],z:a[2],eq:a[3],s:a[4],r:a[5],t:a[6],f:a[7],c:a[8]};});
var EX={}; EX_LIST.forEach(function(e){EX[e.id]=e;});

var RECS=[
 {id:'r-brazos',n:'Brazos + Core exprés',lvl:'Intermedio',ex:['curl','triceps-nuca','curl-martillo','patada-triceps','crunch','plancha']},
 {id:'r-piernas',n:'Piernas sin salir de casa',lvl:'Básico',ex:['sentadilla','zancadas','sumo','talones','puente']},
 {id:'r-full',n:'Cuerpo completo 25',lvl:'Intermedio',ex:['sentadilla','flexiones','remo','press-hombro','rdl','plancha','jacks']},
 {id:'r-pecho',n:'Pecho y espalda',lvl:'Intermedio',ex:['flexiones','press-suelo','remo','aperturas','superman']},

function estMin(items){ var s=0; items.forEach(function(i){ s+=i.s*((i.t||i.r*3)+REST); }); return Math.max(5,Math.round(s/60)); }

function M(){ var o={}; for(var i=0;i<arguments.length;i++) for(var k in arguments[i]) o[k]=arguments[i][k]; return o; }

function drawFig(c,f,eq,t){

  ctx.setTransform(s,0,0,s,(W-200*s)/2,(H-200*s)/2+2*s);
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(FLOOR[f]||eq==='tapete'){ ctx.fillStyle='#34393E'; rr(ctx,10,186,190,6,3); ctx.fill(); }
  else { ctx.strokeStyle='#3A3F44'; ctx.lineWidth=2; line(ctx,[16,188],[184,188]); }
  var fg='#F2F2EE', back=FRONT[f]?fg:'#80868B';
  var ls=pt('ls'),rs=pt('rs'),lp=pt('lp'),rp=pt('rp'),h=pt('h');
  var sm=[(ls[0]+rs[0])/2,(ls[1]+rs[1])/2], pm=[(lp[0]+rp[0])/2,(lp[1]+rp[1])/2];
  ctx.strokeStyle=back; ctx.lineWidth=6.5;
  line(ctx,ls,pt('le'),pt('lh')); line(ctx,lp,pt('lk'),pt('lf'));
  ctx.strokeStyle=fg; ctx.lineWidth=8;
  line(ctx,h,sm); line(ctx,sm,pm); line(ctx,ls,rs); line(ctx,lp,rp);
  ctx.lineWidth=7; line(ctx,rp,pt('rk'),pt('rf'));
  ctx.beginPath(); ctx.arc(h[0],h[1],11,0,Math.PI*2); ctx.fillStyle='#111315'; ctx.fill(); ctx.lineWidth=5; ctx.stroke();
  ctx.strokeStyle=fg; ctx.lineWidth=7; line(ctx,rs,pt('re'),pt('rh'));
  if(eq==='mancuernas'){ ctx.fillStyle='#C6F432'; if(!DB1[f]) dumb(ctx,pt('lh')); dumb(ctx,pt('rh')); }
}
function line(ctx){ ctx.beginPath(); ctx.moveTo(arguments[1][0],arguments[1][1]); for(var i=2;i<arguments.length;i++) ctx.lineTo(arguments[i][0],arguments[i][1]); ctx.stroke(); }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

    c.width=Math.max(1,Math.round(r.width*dpr)); c.height=Math.max(1,Math.round(r.height*dpr));

function daySet(){ var o={}; S.sessions.forEach(function(s){o[s.d]=1;}); return o; }
function streak(){ var ds=daySet(), d=new Date(), n=0; if(!ds[dk(d)]) d=addD(d,-1);
  while(ds[dk(d)]){ n++; d=addD(d,-1); } return n; }
function zoneSets(from,to){ var z={}; S.sessions.forEach(function(s){ if(s.ts>=from&&s.ts<to) for(var k in (s.zones||{})) z[k]=(z[k]||0)+s.zones[k]; }); return z; }
function seedRand(seed){ var x=seed%2147483647; if(x<=0)x+=2147483646; return function(){ x=x*16807%2147483647; return (x-1)/2147483646; }; }
function genRoutine(zones){
  var full=zones.length===ZONES.length, want=full?['Pecho','Espalda','Hombros','Brazos','Abdomen','Piernas','Glúteos']:zones;
  var rnd=seedRand(Number(dk(new Date()).replace(/-/g,''))), per=full?1:Math.max(1,Math.round(6/want.length)), out=[];
  want.forEach(function(z){
    var pool=EX_LIST.filter(function(e){return e.z[0]===z && out.indexOf(e.id)<0;});
    var more=EX_LIST.filter(function(e){return e.z[0]!==z && e.z.indexOf(z)>=0 && out.indexOf(e.id)<0;});
    pool.sort(function(){return rnd()-.5;}); more.sort(function(){return rnd()-.5;});
    pool.concat(more).slice(0,per).forEach(function(e){ out.push(e.id); });
  });
  out=out.slice(0,8);
  var n=full?'Cuerpo completo de hoy':'Rutina de '+want.join(' + ').toLowerCase();
  return {id:'gen',n:n,lvl:'A tu medida',items:out.map(itemOf),gen:true};
}
function pickForYou(){
  var mon=monday(new Date()).getTime(), z=zoneSets(mon,Infinity), had=Object.keys(z).length>0;
  var doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,1))/864e5), best=null,bs=Infinity;
  RECS.forEach(function(r,i){ var sc=0; r.items.forEach(function(it){ sc+=(z[EX[it.id].z[0]]||0); });
    sc=sc/r.items.length + ((i+doy)%RECS.length)*0.001; if(sc<bs){bs=sc;best=r;} });
  return {r:best,why:had?'Trabaja lo que menos has entrenado esta semana':'Para ti'};
}

/* Progreso */
function periodRange(){
  var now=new Date(), o=S.pOff, b=[], from, to, label, prevLabel;
  if(S.period==='week'){ from=addD(monday(now),7*o); to=addD(from,7);
    for(var i=0;i<7;i++){ var d=addD(from,i); b.push({l:DL[i],f:d.getTime(),t:addD(d,1).getTime(),cur:dk(d)===dk(now)}); }
    var e=addD(to,-1); label=from.getDate()+' '+MES[from.getMonth()]+' – '+e.getDate()+' '+MES[e.getMonth()]+' '+e.getFullYear(); prevLabel='la semana anterior';
  } else if(S.period==='month'){ from=new Date(now.getFullYear(),now.getMonth()+o,1); to=new Date(from.getFullYear(),from.getMonth()+1,1);
    for(var w=0;w<5;w++){ var f=new Date(from.getFullYear(),from.getMonth(),1+w*7), t=w===4?to:new Date(from.getFullYear(),from.getMonth(),8+w*7);
      if(f>=to) break; b.push({l:'Sem '+(w+1),f:f.getTime(),t:t.getTime(),cur:now>=f&&now<t}); }
    label=MESL[from.getMonth()]+' '+from.getFullYear(); prevLabel='el mes anterior';
  } else if(S.period==='sem'){ var sm=now.getMonth()<6?0:6; from=new Date(now.getFullYear(),sm+6*o,1); to=new Date(from.getFullYear(),from.getMonth()+6,1);
    for(var m=0;m<6;m++){ var f2=new Date(from.getFullYear(),from.getMonth()+m,1), t2=new Date(from.getFullYear(),from.getMonth()+m+1,1);
      b.push({l:MES[f2.getMonth()],f:f2.getTime(),t:t2.getTime(),cur:now>=f2&&now<t2}); }
    label=(from.getMonth()===0?'1.er':'2.º')+' semestre '+from.getFullYear(); prevLabel='el semestre anterior';
  } else { from=new Date(now.getFullYear()+o,0,1); to=new Date(from.getFullYear()+1,0,1);
    for(var y=0;y<12;y++){ var f3=new Date(from.getFullYear(),y,1), t3=new Date(from.getFullYear(),y+1,1);
      b.push({l:MES[y].charAt(0).toUpperCase(),f:f3.getTime(),t:t3.getTime(),cur:now>=f3&&now<t3}); }
    label='Año '+from.getFullYear(); prevLabel='el año anterior'; }
  return {from:from.getTime(),to:to.getTime(),b:b,label:label,prevLabel:prevLabel,len:to.getTime()-from.getTime()};
}
function vProgress(){
  var R=periodRange(), ses=S.sessions.filter(function(s){return s.ts>=R.from&&s.ts<R.to;});
  var min=0,reps=0; ses.forEach(function(s){min+=s.sec/60;reps+=s.reps;});
  var prevN=0; if(S.period==='week'||S.period==='year'){ var pf=S.period==='week'?R.from-7*864e5:new Date(new Date(R.from).getFullYear()-1,0,1).getTime();
    prevN=S.sessions.filter(function(s){return s.ts>=pf&&s.ts<R.from;}).length; }
  else { var pd=new Date(R.from); pd.setMonth(pd.getMonth()-(S.period==='month'?1:6)); prevN=S.sessions.filter(function(s){return s.ts>=pd.getTime()&&s.ts<R.from;}).length; }
  var vals=R.b.map(function(k){ var m=0; ses.forEach(function(s){ if(s.ts>=k.f&&s.ts<k.t) m+=s.sec/60; }); return Math.round(m); });
  var mx=Math.max.apply(null,vals.concat([1]));
  var chart='<div class="chart" style="grid-template-columns:repeat('+R.b.length+',minmax(0,1fr))">'+R.b.map(function(k,i){
    var hgt=vals[i]?Math.max(6,Math.round(vals[i]/mx*120)):4;
    return '<div class="col"><span class="v num">'+(vals[i]||'')+'</span><div class="b'+(vals[i]?'':' z')+'" style="height:'+hgt+'px"></div><span class="l'+(k.cur?' cur':'')+'">'+k.l+'</span></div>'; }).join('')+'</div>';
  var z=zoneSets(R.from,R.to), tot=0; for(var k in z) tot+=z[k];
  var zones=Object.keys(z).sort(function(a,b){return z[b]-z[a];}).map(function(n){ var p=Math.round(z[n]/tot*100);
    return '<div class="zone"><div class="between small"><span>'+n+'</span><span class="muted num">'+p+'% · '+z[n]+' series</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'; }).join('');
  var hist=ses.slice().reverse().slice(0,10).map(function(s){ var d=new Date(s.ts);
    var conf=S.ask==='del:'+s.id;
    return '<div class="hist"><div class="grow" style="flex:1;min-width:0"><b>'+esc(s.n)+'</b><div class="muted small num">'+DIA[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MES[d.getMonth()]+' · '+Math.max(1,Math.round(s.sec/60))+' min · '+s.reps+' reps</div></div>'+
      (conf?'<button class="link" data-a="cancelAsk">No</button><button class="link" style="color:var(--danger)" data-a="delS" data-v="'+s.id+'">Borrar</button>'
           :'<button class="icon-btn sm" data-a="ask" data-v="del:'+s.id+'" aria-label="Borrar sesión">'+ic('trash',16)+'</button>')+'</div>'; }).join('');
  var seg=[['week','Semana'],['month','Mes'],['sem','Semestre'],['year','Año']].map(function(p){
    return '<button class="'+(S.period===p[0]?'on':'')+'" data-a="period" data-v="'+p[0]+'">'+p[1]+'</button>'; }).join('');
  var empty=!S.sessions.length?'<div class="empty"><b>Tu progreso aparecerá aquí</b><span class="muted small">Cada entreno que termines suma sesiones, minutos, repeticiones y zonas trabajadas, por semana, mes, semestre y año.</span><button class="btn" data-a="tab" data-v="home" style="width:auto">Hacer mi primer entreno</button></div>':'';
  return '<div class="wrap">'+head('Progreso')+'<div class="seg" role="tablist">'+seg+'</div>'+
   '<div class="between"><button class="icon-btn" data-a="pOff" data-v="-1" aria-label="Periodo anterior">'+ic('chevL')+'</button><b>'+R.label+'</b>'+
   '<button class="icon-btn" data-a="pOff" data-v="1" aria-label="Periodo siguiente"'+(S.pOff>=0?' disabled style="opacity:.35"':'')+'>'+ic('chevR')+'</button></div>'+empty+
   '<div class="kpis"><div class="kpi"><b class="num">'+ses.length+'</b><span>Sesiones</span></div><div class="kpi"><b class="num">'+Math.round(min)+'</b><span>Minutos</span></div><div class="kpi"><b class="num">'+reps+'</b><span>Repeticiones</span></div></div>'+
   '<p class="muted small">'+prevN+' sesiones en '+R.prevLabel+' · racha actual: '+streak()+' días</p>'+
   '<div class="panel"><b class="small">Minutos entrenados</b>'+chart+'</div>'+
   '<div class="panel"><b class="small">Zonas trabajadas</b>'+(zones||'<span class="muted small">Sin entrenos en este periodo.</span>')+'</div>'+
   (hist?'<div class="panel"><b class="small">Sesiones</b><div>'+hist+'</div></div>':'')+
   (S.local?'<p class="muted small">Tu historial se guarda en este navegador.</p>':'')+
   (S.user?'<div class="between small"><span class="muted" style="min-width:0;overflow-wrap:anywhere">Cuenta: '+esc(S.user.email)+'</span><button class="link" data-a="logout">Cerrar sesión</button></div>':'')+'</div>';
}

function authErr(e){
  var c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Correo o contraseña incorrectos.';
  if(c==='auth/email-already-in-use') return 'Ya existe una cuenta con ese correo. Inicia sesión.';
  if(c==='auth/weak-password') return 'La contraseña debe tener al menos 6 caracteres.';
  if(c==='auth/invalid-email'||c==='auth/missing-email') return 'Revisa que el correo esté bien escrito.';
  if(c==='auth/too-many-requests') return 'Demasiados intentos. Espera unos minutos e intenta de nuevo.';
  if(c==='auth/network-request-failed') return 'Sin conexión. Revisa tu internet.';
  return 'No se pudo completar. Intenta de nuevo.';
}
function authSubmit(){
  var m=S.authMode||'login', em=(document.getElementById('aEmail').value||'').trim(), msg=document.getElementById('aMsg'), btn=document.getElementById('aBtn');
  var p=document.getElementById('aPass'), p2=document.getElementById('aPass2'); S.authEmail=em;
  function show(t,ok){ msg.textContent=t; msg.style.color=ok?'var(--accent)':'var(--danger)'; }
  if(!em) return show('Escribe tu correo.');
  if(m==='register'&&p.value!==p2.value) return show('Las contraseñas no coinciden.');
  var label=btn.textContent; btn.disabled=true; btn.textContent='Un momento…';
  var job=m==='login'?Store.auth.signInWithEmailAndPassword(em,p.value)
        :m==='register'?Store.auth.createUserWithEmailAndPassword(em,p.value)
        :Store.auth.sendPasswordResetEmail(em);
  job.then(function(){ if(m==='reset'){ show('Te enviamos un correo para restablecer tu contraseña.',true); btn.disabled=false; btn.textContent=label; } })
     .catch(function(e){ show(authErr(e)); btn.disabled=false; btn.textContent=label; });
}

/* ---------- Entreno: lógica ---------- */
var wake=null, actx=null;
function audio(){ try{ if(!actx){ var A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A(); } if(actx&&actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(f,d){ try{ if(!actx) return; var o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f||880; g.gain.value=0.08; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+(d||0.15)); }catch(e){} }
function buzz(){ try{ navigator.vibrate&&navigator.vibrate(12); }catch(e){} }
function startW(r){
  var items=r.items.map(function(i){return {id:i.id,s:i.s,r:i.r,t:i.t};});
  S.w={n:r.n,items:items,ei:0,si:0,count:0,log:items.map(function(i){var a=[];for(var k=0;k<i.s;k++)a.push(null);return a;}),start:Date.now(),phase:'work',restEnd:0,tLeft:items[0].t,running:false,endAt:0};
  try{ navigator.wakeLock&&navigator.wakeLock.request('screen').then(function(l){wake=l;}).catch(function(){}); }catch(e){}
  go('work');
}
function curIt(){ return S.w.items[S.w.ei]; }
function completeSet(val){
  var w=S.w, it=curIt(); w.log[w.ei][w.si]=val; w.count=0; w.running=false;
  if(w.si<it.s-1){ w.si++; w.tLeft=it.t; restStart(); }
  else if(w.ei<w.items.length-1){ w.ei++; w.si=0; w.tLeft=curIt().t; restStart(); }
  else return finish();
  render();
}
function restStart(){ S.w.phase='rest'; S.w.restEnd=Date.now()+REST*1000; }
function skipEx(){ var w=S.w; w.count=0; w.running=false; w.phase='work';
  if(w.ei<w.items.length-1){ w.ei++; w.si=0; w.tLeft=curIt().t; render(); } else finish(); }
function finish(){
  var w=S.w, reps=0, hold=0, sets=0, zones={}, ex=[];
  if(w.phase==='work'&&!curIt().t&&w.count>0&&w.log[w.ei][w.si]==null) w.log[w.ei][w.si]=w.count;
  w.items.forEach(function(it,i){ var e=EX[it.id], done=w.log[i].filter(function(v){return v!=null&&v>0;});
    if(!done.length) return; ex.push({id:it.id,log:w.log[i]}); sets+=done.length;
    done.forEach(function(v){ if(it.t) hold+=v; else reps+=v; });
    e.z.forEach(function(z){ zones[z]=(zones[z]||0)+done.length; }); });
  releaseWake();
  if(!sets){ S.w=null; toast('No registraste series, no se guardó nada.'); go('home'); return; }
  var now=new Date(), rec={id:'s'+now.getTime(),ts:now.getTime(),d:dk(now),n:w.n,sec:Math.round((now-w.start)/1000),reps:reps,hold:hold,sets:sets,zones:zones,ex:ex};
  Store.addSession(rec); S.last=rec; S.w=null; beep(660,.12); setTimeout(function(){beep(990,.2);},140); go('done');
}
function releaseWake(){ try{ wake&&wake.release(); }catch(e){} wake=null; }
setInterval(function(){
  var w=S.w; if(S.view!=='work'||!w) return;
  var el=document.getElementById('elapsed'); if(el) el.textContent=mmss((Date.now()-w.start)/1000);
  if(w.phase==='rest'){ var left=(w.restEnd-Date.now())/1000;
    if(left<=0){ w.phase='work'; beep(880,.25); render(); return; }
    var rl=document.getElementById('restLeft'); if(rl) rl.textContent=mmss(left);
  } else if(w.running){ w.tLeft=Math.max(0,(w.endAt-Date.now())/1000);
    var tl=document.getElementById('tleft'); if(tl) tl.textContent=Math.ceil(w.tLeft);
    if(w.tLeft<=0){ beep(880,.25); completeSet(curIt().t); } }
},250);

/* ---------- Acciones ---------- */
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},2600); }
var A={
  tab:function(v){ go(v); },
  back:function(){ go(S.prev&&S.prev!==S.view&&S.prev!=='work'&&S.prev!=='done'?S.prev:'home'); },
  zone:function(v){ var i=S.zones.indexOf(v); if(i>=0) S.zones.splice(i,1); else S.zones.push(v); render(); },
  zoneAll:function(){ S.zones=S.zones.length===ZONES.length?[]:ZONES.slice(); render(); },
  gen:function(){ if(!S.zones.length) return; S.detail=genRoutine(S.zones); go('detail'); },
  openRec:function(v){ S.detail=findRoutine(v); go('detail'); },
  start:function(){ startW(S.detail); },
  editDetail:function(){ var r=S.detail, custom=S.routines.some(function(x){return x.id===r.id;});
    S.builder={id:custom?r.id:null,n:custom?r.n:(r.gen?'':r.n+' (mía)'),items:r.items.map(function(i){return {id:i.id,s:i.s,r:i.r,t:i.t};})};
    S.bQ=''; S.bZone='Todos'; go('builder'); },
  delRoutine:function(){ var id=S.detail.id; S.routines=S.routines.filter(function(r){return r.id!==id;}); Store.saveRoutines(); toast('Rutina eliminada'); go('routines'); },
  newBuilder:function(){ S.builder={id:null,n:'',items:[]}; S.bQ=''; S.bZone='Todos'; go('builder'); },
  bZone:function(v){ S.bZone=v; document.querySelectorAll('[data-a="bZone"]').forEach(function(b){ b.classList.toggle('on',b.dataset.v===v); }); renderBLib(); },
  tog:function(v){ var it=S.builder.items, i=it.map(function(x){return x.id;}).indexOf(v); if(i>=0) it.splice(i,1); else it.push(itemOf(v)); keep(render); },
  rm:function(v){ S.builder.items.splice(+v,1); keep(render); },
  mv:function(v,el){ var it=S.builder.items, i=+v, j=i+(+el.dataset.d); if(j<0||j>=it.length) return; var t=it[i]; it[i]=it[j]; it[j]=t; keep(render); },
  st:function(v,el){ var x=S.builder.items[+v], k=el.dataset.k, d=+el.dataset.d, lim={s:[1,10],r:[1,100],t:[5,300]}[k];
    x[k]=Math.min(lim[1],Math.max(lim[0],x[k]+d)); keep(render); },
  saveB:function(){ var b=S.builder; if(!b.items.length) return;
    var n=(b.n||'').trim()||('Mi rutina '+(S.routines.length+1));
    var r={id:b.id||('u'+Date.now()),n:n,lvl:'Personal',items:b.items};
    var i=S.routines.map(function(x){return x.id;}).indexOf(r.id); if(i>=0) S.routines[i]=r; else S.routines.push(r);
    Store.saveRoutines(); S.builder=null; S.detail=r; toast('Rutina guardada'); S.prev='routines'; S.view='detail'; render(); },
  startB:function(){ var b=S.builder; if(!b.items.length) return; startW({n:(b.n||'').trim()||'Rutina libre',items:b.items}); },
  libZone:function(v){ S.libZone=v; render(); },
  openEx:function(v){ S.ex=v; go('ex'); },
  addToB:function(v){ if(!S.builder) S.builder={id:null,n:'',items:[]};
    if(!S.builder.items.some(function(i){return i.id===v;})) S.builder.items.push(itemOf(v));
    toast('Agregado a tu rutina'); S.prev='lib'; S.view='builder'; render(); window.scrollTo(0,0); },
  ask:function(v){ S.ask=v; render(); },
  cancelAsk:function(){ S.ask=null; render(); },
  exitW:function(){ S.w=null; releaseWake(); go('home'); },
  finish:function(){ finish(); },
  rep:function(){ var w=S.w, it=curIt(); w.count++; buzz(); beep(1200,.04);
    if(w.count>=it.r){ beep(880,.2); completeSet(w.count); } else render(); },
  undo:function(){ S.w.count=Math.max(0,S.w.count-1); render(); },
  endSet:function(){ var w=S.w, it=curIt(); if(w.running) w.tLeft=Math.max(0,(w.endAt-Date.now())/1000);
    var v=it.t?Math.round(it.t-w.tLeft):w.count; completeSet(v>0?v:0); },
  skipEx:function(){ skipEx(); },
  timer:function(){ var w=S.w; if(w.running){ w.tLeft=Math.max(0,(w.endAt-Date.now())/1000); w.running=false; } else { w.endAt=Date.now()+w.tLeft*1000; w.running=true; } render(); },
  rest15:function(){ S.w.restEnd+=15000; },
  skipRest:function(){ S.w.phase='work'; render(); },
  period:function(v){ S.period=v; S.pOff=0; S.ask=null; render(); },
  pOff:function(v){ var n=S.pOff+(+v); if(n>0) return; S.pOff=n; render(); },
  authMode:function(v){ var e=document.getElementById('aEmail'); if(e) S.authEmail=e.value; S.authMode=v; render(); },
  logout:function(){ if(Store.auth) Store.auth.signOut(); },
  delS:function(v){ Store.delSession(v); S.ask=null; toast('Sesión borrada'); render(); }
};
function keep(fn){ var y=window.scrollY; fn(); window.scrollTo(0,y); }
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]'); if(!el||el.disabled) return;
  audio(); var f=A[el.dataset.a]; if(f) f(el.dataset.v,el);
});
document.addEventListener('submit',function(ev){ if(ev.target.id==='authForm'){ ev.preventDefault(); authSubmit(); } });
document.addEventListener('input',function(ev){
  if(ev.target.id==='bname'&&S.builder) S.builder.n=ev.target.value;
  if(ev.target.id==='bq'){ S.bQ=ev.target.value; renderBLib(); }
});
document.addEventListener('keydown',function(ev){
  if(S.view!=='work'||!S.w||S.w.phase!=='work') return;
  if(ev.target.tagName==='INPUT'||ev.target.tagName==='BUTTON') return;
  if(ev.code==='Space'){ ev.preventDefault(); audio(); if(curIt().t) A.timer(); else A.rep(); }
});
var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(setupCanvases,150); });

/* ---------- Arranque ---------- */
navInit(); Store.loadLocal(); Store.init(); render(); requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ if(S.view!=='work') setupCanvases(); });
if("serviceWorker" in navigator) window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
})();
</script>
