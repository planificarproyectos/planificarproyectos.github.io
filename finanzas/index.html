<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planificar Finanzas · Planificar Proyectos</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<!--
  Planificar Finanzas (Planificar Proyectos Apps). App personal: solo la abre planificarproyectos@gmail.com.
  Esta página pública solo trae el inicio de sesión. El contenido de la app (código, cifras y textos) está cifrado
  con AES-256-GCM en app.bin; la clave se guarda en Firestore (users/{uid}/finanzas/clave), que solo lee esa cuenta.
  Los datos se sincronizan en users/{uid}/finanzas/sync. Para actualizar la app se usa el repositorio privado datos-apps.
-->
<style id="fin-css"></style>
<style id="fin-ov">
[hidden]{display:none!important}
:root[data-theme="light"]{--bg:#F3F4F1;--surface:#FFFFFF;--surface-2:#F7F7F4;--ink:#111315;--muted:#62676C;--line:#E2E2DC;
  --glass:#FFFFFF;--glass-2:#F3F4F1;--glass-brd:#E2E2DC;--glass-shadow:none;color-scheme:light}
:root[data-theme="dark"]{--bg:#111315;--surface:#1C1F22;--surface-2:#24282C;--ink:#F2F2EE;--muted:#A3A8AD;--line:#3A3F44;
  --glass:#1C1F22;--glass-2:#24282C;--glass-brd:#3A3F44;--glass-shadow:none;color-scheme:dark}
html,:root[data-theme] html,:root[data-theme]{background:var(--bg,#111315)!important}
body,:root[data-theme] body{margin:0;background:var(--bg,#111315)!important;color:var(--ink,#F2F2EE);font-family:"DM Sans",system-ui,-apple-system,sans-serif!important}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif!important;letter-spacing:.3px}
.num{font-family:"DM Sans",system-ui,sans-serif!important;font-variant-numeric:tabular-nums}
.panel,.kpis,.budget,.qz .qc,.grpsum .g,.imp .c,.hero,.tabs,.qinc,.seg,.syncb,.reset,.add-btn,#syncRetry{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.tabs button[aria-selected=true],:root[data-theme="dark"] .tabs button[aria-selected=true],
.seg button[aria-selected="true"],.seg button[aria-pressed="true"],
:root[data-theme="dark"] .seg button[aria-selected="true"],:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--accent)!important;color:var(--accent-ink)!important;box-shadow:none!important}
.hc-r .theme-sw{display:none!important}
#toast{background:var(--surface-2)!important;color:var(--ink)!important;border:1px solid var(--line)!important}
/* Cuenta */
#tab-cuenta .cta-wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#tab-cuenta .cta-card{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#tab-cuenta .cta-h{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.5px;font-size:16px;text-transform:uppercase;color:var(--muted)}
#tab-cuenta .cta-name{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px}
#tab-cuenta .cta-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#tab-cuenta .cta-email{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
#tab-cuenta .cta-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#tab-cuenta .cta-rl{display:flex;flex-direction:column;gap:2px;min-width:0}
#tab-cuenta .cta-sub{font-size:12.5px;color:var(--muted)}
#tab-cuenta .cta-switch{position:relative;flex:none;width:52px;height:30px;border-radius:99px;border:0;background:var(--line);cursor:pointer;transition:background .15s}
#tab-cuenta .cta-switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
#tab-cuenta .cta-switch[aria-checked="true"]{background:var(--accent)}
#tab-cuenta .cta-switch[aria-checked="true"]::after{transform:translateX(22px)}
#tab-cuenta .cta-pick{--ap-bg:var(--surface)}
#tab-cuenta .cta-link{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--ink);font-weight:500;min-height:32px}
#tab-cuenta .cta-go{color:var(--accent-fg);font-size:13px;white-space:nowrap}
#tab-cuenta .cta-salir{padding:12px;min-height:48px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
/* Acceso */
.pp-gate{position:fixed;inset:0;z-index:100000;background:#111315;color:#F2F2EE;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"DM Sans",system-ui,sans-serif}
.pp-card{width:min(400px,100%);background:#1C1F22;border:1px solid #3A3F44;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px}
.pp-card img{width:56px;height:56px;border-radius:14px}
.pp-card h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px}
.pp-card p{margin:0;color:#A3A8AD;font-size:14px;line-height:1.45}
.pp-card input{background:#111315;color:#F2F2EE;border:1px solid #3A3F44;border-radius:12px;padding:12px;font:inherit;font-size:15px}
.pp-card .pp-primary{background:#C6F432;border:none;border-radius:12px;padding:12px;font:inherit;font-weight:700;font-size:15px;color:#111315;cursor:pointer}
.pp-card .pp-primary:disabled{opacity:.5}
.pp-card .pp-lnk{background:none;border:0;color:#A3A8AD;text-decoration:underline;cursor:pointer;font:inherit;padding:0;align-self:flex-start}
#aMsg{color:#FF9B8A;font-size:13px;min-height:1em}
</style>
<script>if('serviceWorker'in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</head>
<body>
<div class="pp-gate" id="gate">
  <form class="pp-card" id="loginForm" novalidate>
    <img src="icon.svg" alt="">
    <h1>Planificar Finanzas</h1>
    <p id="gateTxt">Cargando…</p>
    <div id="loginBox" hidden>
      <div data-google-slot></div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <input id="lEm" type="email" placeholder="Correo" autocomplete="email" inputmode="email">
        <input id="lPw" type="password" placeholder="Contraseña" autocomplete="current-password">
        <button class="pp-primary" type="submit">Iniciar sesión</button>
      </div>
    </div>
    <div id="keyBox" hidden style="display:flex;flex-direction:column;gap:12px">
      <input id="lKey" type="text" placeholder="Clave de la app" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="pp-primary" type="button" id="kBtn">Abrir la app</button>
    </div>
    <div id="aMsg" role="alert"></div>
    <button class="pp-lnk" type="button" id="lOut" hidden>Usar otra cuenta</button>
    <a class="pp-lnk" href="/planificar-proyectos-apps/">Ir a Planificar Proyectos Apps</a>
  </form>
</div>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="/google-login.js"></script>
<script src="../apariencia.js"></script>
<script src="../uso.js"></script>
<script src="../wellness-soporte.js"></script>
<script>
(function(){
  var OWNER='planificarproyectos@gmail.com', APP='Planificar Finanzas', $g=function(id){return document.getElementById(id)};
  function msg(t){$g('aMsg').textContent=t||''}
  function ver(paso){$g('gate').hidden=!paso;$g('loginBox').hidden=paso!=='login';$g('keyBox').hidden=paso!=='clave';
    $g('keyBox').style.display=paso==='clave'?'flex':'none';$g('lOut').hidden=paso==='login'||paso==='cargando'||!paso}
  if(!window.firebase||!window.FIREBASE_CONFIG){$g('gateTxt').textContent='Sin conexión. Revisa tu internet.';return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  var auth=firebase.auth(),fs=firebase.firestore();auth.languageCode='es';
  if(window.GoogleLogin) GoogleLogin.usar(auth,msg);

  // Color de énfasis y modo claro/oscuro compartidos con las demás apps
  var oscuro=null;
  function apl(st){var r=document.documentElement,light=st.mode==='light',c=st.accent,a=light?Apariencia.forLight(c):c;
    r.style.setProperty('--accent',c);r.style.setProperty('--accent-fg',a);r.style.setProperty('--accent-ink',Apariencia.ink(c));
    r.style.setProperty('--glacier',a);r.style.setProperty('--ios-blue',a);
    window.__finDark=!light;
    if(window.__applyTheme){try{window.__applyTheme(!light,true)}catch(e){}}else r.setAttribute('data-theme',light?'light':'dark');
    oscuro=!light;var sw=$g('cta-modo');if(sw){sw.setAttribute('aria-checked',String(!light));var s=$g('cta-modo-sub');if(s)s.textContent=(light?'Desactivado':'Activado')+' · igual en todas las apps'}}
  if(window.Apariencia){var l0=Apariencia.local();if(l0)apl(l0);
    Apariencia.on(function(st,preview){apl(st);var sl=$g('cta-apariencia-slot');if(!preview&&sl&&sl.innerHTML){try{sl.innerHTML=Apariencia.picker()}catch(e){}}})}

  function salir(){auth.signOut().then(function(){location.reload()})}
  $g('lOut').onclick=salir;
  $g('loginForm').addEventListener('submit',function(e){e.preventDefault();if(!$g('keyBox').hidden){$g('kBtn').click();return}
    var em=$g('lEm').value.trim(),pw=$g('lPw').value;
    if(!em||!pw){msg('Escribe tu correo y contraseña.');return}
    auth.signInWithEmailAndPassword(em,pw).catch(function(x){msg(/password|credential|user-not-found/.test(x&&x.code||'')?'Correo o contraseña incorrectos.':'No se pudo iniciar sesión ('+(x&&x.code||'error')+')')})});

  // Paquete cifrado: AES-256-GCM, 12 bytes de IV + texto cifrado (con la etiqueta al final)
  var binP=null;
  function bin(){return binP||(binP=fetch('app.bin',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('app.bin '+r.status);return r.arrayBuffer()}))}
  function b64u(s){s=String(s).trim().replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function abrir(k){return bin().then(function(buf){var raw=b64u(k);if(raw.length!==32)throw new Error('clave');
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(buf,0,12)},key,new Uint8Array(buf,12))})})
    .then(function(p){return JSON.parse(new TextDecoder().decode(p))})}

  function correr(code){var s=document.createElement('script');s.textContent=code;document.body.appendChild(s);s.remove()}
  function montar(u,P){
    var uid=u.uid,col=fs.collection('users').doc(uid).collection('finanzas');
    // Puente: la app usaba el almacenamiento de Claude (data/users/<id>/<doc>); aquí va a Firestore
    window.claude={use:function(n){
      if(n==='db')return Promise.resolve({doc:function(p){return col.doc(String(p).split('/').pop())}});
      if(n==='user')return Promise.resolve({id:function(){return Promise.resolve(uid)},me:function(){return Promise.resolve({email:u.email,name:u.displayName})},isOwner:function(){return Promise.resolve(true)}});
      return Promise.resolve(null)}};
    var semilla=col.doc('sync').get().then(function(sn){if(!sn.exists&&P.semilla)return col.doc('sync').set(P.semilla)}).catch(function(){});
    return semilla.then(function(){
      $g('fin-css').textContent=P.css;
      correr(P.chart);
      var app=$g('app');app.innerHTML=P.html;
      Array.prototype.slice.call(app.querySelectorAll('script')).forEach(function(s){var c=s.textContent;s.remove();try{correr(c)}catch(e){console.error(e)}});
      cuenta(u);
      if(window.Apariencia){var st=Apariencia.state||Apariencia.local();if(st)apl(st)}
      ver(null);
    })}

  function cuenta(u){var em=String(u.email||'').toLowerCase();
    $g('cta-email').textContent=em;$g('cta-nombre').textContent=u.displayName||em.split('@')[0];
    try{fs.collection('users').doc(u.uid).collection('perfil').doc('datos').onSnapshot(function(d){var n=d.exists&&d.data().nombre||'';if(n)$g('cta-nombre').textContent=n},function(){})}catch(e){}
    if(window.Apariencia){try{$g('cta-apariencia-slot').innerHTML=Apariencia.picker()}catch(e){}
      $g('cta-modo').onclick=function(){Apariencia.set({mode:oscuro?'light':'dark'})}}
    if(window.wellnessWA){$g('cta-soporte').href=wellnessWA(APP,'soporte',em);$g('cta-reco').href=wellnessWA(APP,'recomendacion',em)}
    $g('cta-salir').onclick=salir}

  function pedirClave(u,txt){ver('clave');$g('gateTxt').textContent=txt||'Primera vez en este sistema: pega la clave de la app. Solo se pide una vez; queda guardada en tu cuenta.';
    $g('kBtn').onclick=function(){var k=$g('lKey').value.trim();if(!k){msg('Pega la clave.');return}
      $g('kBtn').disabled=true;msg('');
      abrir(k).then(function(P){return fs.collection('users').doc(u.uid).collection('finanzas').doc('clave').set({k:k,t:Date.now()}).then(function(){return montar(u,P)})})
        .catch(function(e){msg(e&&e.code==='permission-denied'?'No se pudo guardar la clave (permiso denegado).':'Clave incorrecta.')})
        .finally(function(){$g('kBtn').disabled=false})}}

  auth.onAuthStateChanged(function(u){
    msg('');
    if(!u){ver('login');$g('gateTxt').textContent='App personal · Inicia sesión con tu cuenta de Planificar Proyectos Apps.';return}
    var em=String(u.email||'').toLowerCase();
    if(em!==OWNER){ver('sin');$g('gateTxt').textContent='La cuenta '+em+' no tiene acceso a '+APP+'. Es una app personal de '+OWNER+'.';return}
    ver('cargando');$g('gateTxt').textContent='Abriendo…';
    try{if(window.Apariencia)Apariencia.connect(fs,u.uid,function(){return Apariencia.local()})}catch(e){}
    try{Uso.start(fs,u,'finanzas')}catch(e){}
    bin();
    fs.collection('users').doc(u.uid).collection('finanzas').doc('clave').get().then(function(sn){
      var k=sn.exists&&sn.data().k;if(!k)return pedirClave(u);
      return abrir(k).then(function(P){return montar(u,P)},function(){pedirClave(u,'La app se actualizó con una clave nueva. Pega la clave nueva.')})
    }).catch(function(e){ver('sin');$g('gateTxt').textContent='No se pudo abrir la app: '+((e&&(e.code||e.message))||'error')+'.'});
  });
})();
</script>
</body>
</html>
