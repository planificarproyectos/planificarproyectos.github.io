<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Proyecta</title>
<script>/* Arranca siempre en oscuro hasta que llega el tema de la cuenta; nada se guarda en el navegador */
document.documentElement.setAttribute('data-theme','dark');document.documentElement.setAttribute('data-early','');
try{localStorage.removeItem('proyecta:theme')}catch(e){}</script>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: app móvil · barra superior con marca y proyecto activo · pantallas a una columna (2 en escritorio) · navegación fija abajo · una tipografía (Manrope) · énfasis configurable */
:root{
  --bg:#0D0E0D; --panel:#171817; --sunk:#212220; --ink:#F1F2EE; --muted:#8D9089; --line:#272826;
  --acc:#C6F135; --on-acc:#10110F; --acc-ink:#C6F135; --acc-soft:rgba(198,241,53,.12);
  --chart-pos:#C6F135; --chart-neu:#6E8426;
  --neg:#FF7362; --neg-soft:rgba(255,115,98,.12); --warn:#F0B63E; --warn-soft:rgba(240,182,62,.12);
  --band1:rgba(255,255,255,.015); --band2:rgba(198,241,53,.05); --band3:rgba(255,255,255,.035);
  --font:"Manrope","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --col:#121312;
  --r:18px; --r-sm:12px; --nav-h:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F4F0; --panel:#FFFFFF; --sunk:#EDEEE9; --ink:#111210; --muted:#676A63; --line:#E4E5E0;
  --acc:#C6F135; --on-acc:#10110F; --acc-ink:#4C6800; --acc-soft:#EEF8CC; --chart-pos:#8DBA12; --chart-neu:#57730B;
  --neg:#C63D2B; --neg-soft:#FBE4E0; --warn:#9A6400; --warn-soft:#FAEFD6;
  --band1:rgba(0,0,0,.015); --band2:rgba(141,186,18,.07); --band3:rgba(0,0,0,.03); --col:#E9EAE5; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F4F0; --panel:#FFFFFF; --sunk:#EDEEE9; --ink:#111210; --muted:#676A63; --line:#E4E5E0;
  --acc:#C6F135; --on-acc:#10110F; --acc-ink:#4C6800; --acc-soft:#EEF8CC; --chart-pos:#8DBA12; --chart-neu:#57730B;
  --neg:#C63D2B; --neg-soft:#FBE4E0; --warn:#9A6400; --warn-soft:#FAEFD6;
  --band1:rgba(0,0,0,.015); --band2:rgba(141,186,18,.07); --band3:rgba(0,0,0,.03); --col:#E9EAE5; color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0D0E0D; --panel:#171817; --sunk:#212220; --ink:#F1F2EE; --muted:#8D9089; --line:#272826;
  --neg:#FF7362; --neg-soft:rgba(255,115,98,.12); --warn:#F0B63E; --warn-soft:rgba(240,182,62,.12);
  --band1:rgba(255,255,255,.015); --band3:rgba(255,255,255,.035); --col:#121312; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 20px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;margin-inline:auto}

/* Barra superior */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
.appbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 8px}
.brand{font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:9px}
.brand span{color:var(--acc-ink)}
.brand .logo{width:32px;height:32px;flex:none;display:block}
.projbtn{display:flex;align-items:center;gap:8px;min-width:0;max-width:56%;background:var(--panel);border:0;border-radius:99px;padding:6px 8px 6px 12px;cursor:pointer;font-weight:700;font-size:12.5px}
.projbtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.projbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.projbtn .dot.off{background:var(--muted)} .projbtn .dot.busy{background:var(--warn)} .projbtn .dot.err{background:var(--neg)}
.projbtn svg{width:16px;height:16px;flex:none;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;margin-top:4px}
.banner b{color:var(--warn)}

/* Pantallas */
.screen{display:grid;gap:12px;padding-block:6px 16px;container:scr / inline-size;align-content:start}
.screen-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-block:6px 2px}
.screen-head h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.screen-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;margin:10px 0 0}
.card{background:var(--panel);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:12px;margin:0 0 4px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;text-wrap:balance}
.card h4{font-size:14px;margin:0;font-weight:800}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid2{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container scr (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:5;background:var(--bg);margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}

/* Inicio */
.hello .date{color:var(--muted);font-size:12.5px;font-weight:600}
.hello h1{font-size:26px;font-weight:800;margin:2px 0 0;letter-spacing:-.01em}
.projcard{display:flex;justify-content:space-between;align-items:center;gap:12px}
.projcard .t{font-weight:800;font-size:16px}
.projcard .d{color:var(--muted);font-size:12.5px}
.hero{position:relative;background:var(--acc);color:var(--on-acc);border-radius:22px;padding:18px 20px 20px;display:grid;gap:4px}
.hero.loss{background:var(--neg);color:#fff}
.hero .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;opacity:.75}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .mini{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;font-weight:700;margin-top:6px;padding-right:56px}
.hero .mini span{opacity:.7;font-weight:500;margin-right:4px}
.hero .go{position:absolute;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;background:var(--on-acc);color:var(--acc);border:0;display:grid;place-items:center;cursor:pointer}
.hero.loss .go{background:#fff;color:var(--neg)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@container scr (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container scr (min-width:900px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{background:var(--panel);border-radius:var(--r-sm);padding:12px 14px;min-width:0}
.tile .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:17px;font-weight:700;white-space:nowrap;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.tile .v.bad{color:var(--neg)}
.alerts{display:grid;gap:6px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:var(--r-sm);font-size:13px;background:var(--sunk)}
.alert b{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin-top:1px;font-weight:800;white-space:nowrap}
.alert.crit b{background:var(--neg-soft);color:var(--neg)}
.alert.warn b{background:var(--warn-soft);color:var(--warn)}
.alert.ok b{background:var(--acc);color:var(--on-acc)}
.port{display:grid;gap:6px}
.port button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:left;background:var(--sunk);border:0;border-radius:var(--r-sm);padding:12px 14px;cursor:pointer}
.port button[aria-current=true]{box-shadow:inset 0 0 0 1.5px var(--acc)}
.port .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.port .k{font-weight:700;text-align:right}
.port .m{grid-column:1/-1;color:var(--muted);font-size:12px}

/* Gráficos */
svg text{font-family:var(--font);font-size:10.5px;fill:var(--muted);font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}
.chart-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bars{display:grid;gap:11px}
.bar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 58px;gap:12px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--chart-neu);border-radius:99px}
.bar .fill.util{background:var(--acc)} .bar .fill.neg{background:var(--neg)}
.bar .amt{text-align:right;font-size:12.5px;font-weight:600}
@container scr (max-width:420px){.bar{grid-template-columns:minmax(0,108px) minmax(0,1fr) 52px;gap:8px;font-size:12.5px}}

/* Formularios */
.fields{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container scr (min-width:520px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container scr (min-width:860px){.fields{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fields.tight{grid-template-columns:repeat(2,minmax(0,1fr))}
@container scr (min-width:860px){.fields.tight{grid-template-columns:repeat(4,minmax(0,1fr))}}
.f{min-width:0}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .box{display:flex;align-items:center;border-radius:var(--r-sm);background:var(--sunk);box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .15s}
.f .box:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc)}
.f input,.f select{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:11px 12px;font-weight:600;font-size:15px;appearance:none;-webkit-appearance:none}
.f input[type=number]{text-align:right}
.f select{cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.f input:focus,.f select:focus{outline:none}
.f .u{padding-right:12px;font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:600}
.f .hint{font-size:11.5px;color:var(--muted);margin-top:4px;text-align:right;min-height:1em}
.f.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;align-self:end;min-height:46px}
.f.sw label{margin:0;color:var(--ink);font-size:13px;white-space:normal}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch input:checked+i{background:var(--acc)}
.switch input:checked+i::after{transform:translateX(18px);background:var(--on-acc)}
.item{background:var(--sunk);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item.torre{grid-template-columns:minmax(0,1fr) auto;align-items:end}
.item-head .tag{flex:none}
.item .f .box{background:var(--panel)}
.item .f.sw{background:var(--panel)}
.list{display:grid;gap:10px}
.iconbtn{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--panel);color:var(--neg)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.addbtn{border:1.5px dashed var(--line);background:transparent;border-radius:var(--r-sm);padding:12px;font-weight:700;color:var(--acc-ink);cursor:pointer;width:100%}
.addbtn:hover{border-color:var(--acc-ink)}
.pricelist{font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.pricelist b{color:var(--ink)}
.curvegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.curvegrid .f label{font-size:10.5px;text-align:center}
.curvegrid .f input{padding:8px 6px;text-align:center;font-size:13px}
.readonly .f input,.readonly .f select,.readonly .switch input{pointer-events:none}
.readonly .addbtn,.readonly .iconbtn{display:none}
.live{position:sticky;z-index:4;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);margin-top:4px}
.live .in{max-width:640px;margin:0 auto;background:var(--acc);color:var(--on-acc);border-radius:16px;padding:10px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.live .in.loss{background:var(--neg);color:#fff}
.live .l{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;opacity:.7}
.live .v{font-size:15px;font-weight:800;white-space:nowrap}

/* Controles */
.btn{border:1px solid var(--line);background:transparent;padding:9px 16px;border-radius:99px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--acc-ink);color:var(--acc-ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{color:var(--on-acc);filter:brightness(1.05)}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--panel);border-radius:99px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:8px 16px;cursor:pointer;color:var(--muted);font-weight:700;border-radius:99px;white-space:nowrap;font-size:13px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--on-acc)}
.seg.sunk{background:var(--sunk)}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:800;white-space:nowrap}
.tag.acc{background:var(--acc-soft);color:var(--acc-ink)}
.empty{color:var(--muted);font-size:13px;padding:16px;border:1px dashed var(--line);border-radius:var(--r-sm)}

/* Tablas */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm);max-width:100%;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:700;color:var(--muted);background:var(--panel);position:sticky;top:0;font-size:11.5px;z-index:1}
td.c0,th.c0{text-align:left;position:sticky;left:0;background:var(--panel);z-index:2;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
th.c0{z-index:3}
td{font-weight:500}
td.c0{font-weight:600}
tr.tot td{font-weight:800;background:var(--sunk)} tr.tot td.c0{background:var(--sunk)}
tr.sec td{color:var(--acc-ink);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding-top:16px;border-bottom:0}
td.neg{color:var(--neg)} td.pos{color:var(--acc-ink)}
th.ph1{box-shadow:inset 0 -2px 0 var(--chart-neu)} th.ph2{box-shadow:inset 0 -2px 0 var(--acc)} th.ph3{box-shadow:inset 0 -2px 0 var(--muted)}
.matrix td{text-align:center}
.matrix td.good{background:var(--acc-soft);color:var(--acc-ink)} .matrix td.bad{background:var(--neg-soft);color:var(--neg)} .matrix td.mid{background:var(--warn-soft);color:var(--warn)}
.matrix td.base{outline:2px solid var(--ink);outline-offset:-2px;font-weight:800}
.tbl-in td{padding:4px 6px}
.tbl-in input{width:100%;min-width:92px;border:0;background:var(--sunk);border-radius:8px;padding:7px 8px;text-align:right;font-weight:600}
.tbl-in input:focus{outline:1.5px solid var(--acc)}
textarea.paste{width:100%;min-height:96px;font-size:12px;border:0;background:var(--sunk);border-radius:var(--r-sm);padding:10px;resize:vertical}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-weight:700;text-align:right}
.metric{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@container scr (min-width:640px){.metric{grid-template-columns:repeat(4,minmax(0,1fr))}}
.diff{display:grid;gap:4px;font-size:13px}
.diff div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:8px 10px;background:var(--sunk);border-radius:10px}
.diff i{font-style:normal;color:var(--muted)}

/* Hoja inferior */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:86vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 4px}
.sheet h2{margin:0;font-size:20px;font-weight:800}

/* Cuenta */
.profile{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:22px;font-weight:800;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile input{width:100%;border:0;background:transparent;font-size:20px;font-weight:800;padding:2px 0}
.profile input:focus{outline:none}
.profile small{color:var(--muted);font-size:12.5px}
.set{display:grid}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set-row:first-child{border-top:0;padding-top:4px}
.set-row .t{font-weight:700}
.set-row .d{color:var(--muted);font-size:12.5px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
.sw-c{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:var(--c);box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.sw-c[aria-pressed=true]{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ink)}
.sw-c.custom{position:relative;overflow:hidden;background:conic-gradient(#ff5f5f,#ffd23f,#7cf03c,#36d1f2,#7b6bff,#ff5fa2,#ff5f5f)}
.sw-c.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.roles{display:grid;gap:6px;font-size:12.5px}
.roles div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:8px 10px;border-radius:10px;background:var(--sunk)}
.roles div.me{box-shadow:inset 0 0 0 1.5px var(--acc)}
.roles b{font-weight:800}
.profile .pname{font-size:18px;font-weight:800;overflow-wrap:anywhere}.profile small{color:var(--muted);overflow-wrap:anywhere}
.avatar svg{display:block}
.namecard{display:grid;gap:8px}.namecard small{color:var(--muted)}.lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.namecard.need{background:var(--acc);color:var(--on-acc)}.namecard.need .lbl,.namecard.need small{color:inherit;opacity:.75}
.namecard.need input{background:rgba(0,0,0,.12);color:inherit}.namecard.need .btn.pri{background:var(--on-acc);color:var(--acc);border-color:var(--on-acc)}
.namerow{display:flex;gap:8px}.namerow input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.acckpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acckpis div{background:var(--panel);border-radius:var(--r-sm);padding:12px 14px;display:grid;gap:2px;min-width:0}
.acckpis b{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acckpis span{font-size:11.5px;color:var(--muted)}
.astack{display:grid;gap:8px}
.acard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:0;border-radius:var(--r-sm);padding:14px 16px;cursor:pointer;color:var(--ink);text-decoration:none;font:inherit}
.acard>svg:first-child{flex:none;color:var(--acc-ink)}.acard>svg:last-child{flex:none;color:var(--muted)}
.acard .grow{flex:1;display:grid;gap:2px;min-width:0}.acard .grow span{font-size:12.5px;color:var(--muted)}
.acard:hover{filter:brightness(1.06)}.acard.static{cursor:default}.acard.static:hover{filter:none}
.acard.danger>svg:first-child,.acard.danger b{color:var(--neg)}
.acard.hl{box-shadow:inset 0 0 0 1px var(--acc-ink);margin-top:8px}
.card.ask{display:grid;gap:8px;box-shadow:inset 0 0 0 1px var(--neg)}.card.ask small{color:var(--muted)}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff}
.wsw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.wsw button{display:grid;justify-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--muted);font:inherit;font-size:12px;font-weight:600}
.wsw i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#10110F;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.wsw button[aria-checked=true]{color:var(--ink)}.wsw button[aria-checked=true] i{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ink)}
.between{display:flex;justify-content:space-between;align-items:center;gap:14px}
.about{color:var(--muted);font-size:12.5px;text-align:center;padding:8px 0}

/* Informe */
.report{display:grid;gap:14px}
.report>*{min-width:0}
.report .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@container scr (min-width:640px){.report .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));max-width:720px;margin:0 auto;height:var(--nav-h)}
.nav button{border:0;background:transparent;display:grid;justify-items:center;align-content:center;gap:4px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;padding:0}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current=page],.nav button[aria-pressed=true]{color:var(--acc-ink)}
.nav button{position:relative}
.nav button[aria-pressed=true]::before{content:"";position:absolute;top:6px;width:18px;height:3px;border-radius:99px;background:var(--acc)}
.nav button[aria-pressed=false]{opacity:.75}

/* Vista web: columnas como pantallas */
.colcap{display:none}
body.web{padding-bottom:0;overflow:hidden}
body.web .wrap{max-width:none}
body.web .cols{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,560px));justify-content:center;gap:12px;padding-bottom:12px}
body.web .cols>.screen{grid-auto-rows:max-content;overflow-y:auto;overscroll-behavior:contain;background:var(--col);border-radius:22px;padding:0 14px 14px;min-width:0;scrollbar-width:thin}
body.web .colcap{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:6;background:var(--col);margin:0 -14px;padding:10px 8px 6px 18px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
body.web .colcap{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
body.web .colcap .cap-t{display:flex;align-items:center;gap:6px}
body.web .colcap .grip{width:16px;height:16px;fill:currentColor;opacity:.7}
body.web .colcap .cap-b{display:flex;gap:0}
body.web .colcap .iconbtn{width:30px;height:30px}
body.web .colcap .iconbtn:disabled{opacity:.3;cursor:default;background:transparent}
body.web .screen.dragging{z-index:30;cursor:grabbing;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 0 0 1.5px var(--acc);animation:none}
#dropLine{position:fixed;width:4px;border-radius:4px;background:var(--acc);z-index:31;pointer-events:none}
body.web .colcap .iconbtn:hover{color:var(--ink);background:var(--panel)}
body.web .chips{top:42px;background:var(--col)}
body.web .screen-head h1{font-size:22px}
body.web .live{bottom:6px}
body.web #s-cuenta{position:fixed;z-index:25;top:calc(var(--top,60px) + 4px);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);right:max(16px,env(safe-area-inset-right,0px));width:min(480px,calc(100% - 32px));background:var(--bg);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.scrim{position:fixed;inset:0;z-index:24;background:rgba(0,0,0,.35)}
@media (prefers-reduced-motion:no-preference){.screen.flash{animation:fl .7s ease}@keyframes fl{0%{box-shadow:inset 0 0 0 2px var(--acc)}100%{box-shadow:inset 0 0 0 2px transparent}}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:40;max-width:calc(100% - 32px);text-align:center}
.auth{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;overflow-y:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:400px;display:grid;gap:18px}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.auth-brand .logo-lg{width:76px;height:76px}
.auth-brand .nm{font-weight:800;font-size:22px;letter-spacing:.04em}
.auth-brand .nm span{color:var(--acc-ink)}
.auth h2{margin:0;font-size:22px;font-weight:800}
#authForm{display:grid;gap:12px}
#authForm input{text-align:left}
.amsg{min-height:1.2em;margin:0;font-size:13px;color:var(--neg)}
.amsg.ok{color:var(--acc-ink)}
.lnk{border:0;background:none;color:var(--acc-ink);font-weight:700;cursor:pointer;padding:4px;justify-self:center;font-size:13.5px}
body.authing .nav,body.authing .appbar{visibility:hidden}
.loading{display:grid;place-items:center;gap:10px;padding:80px 0;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s ease}.screen{animation:in .18s ease}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* Deslizadores para mouse: barra visible y flechas en zonas con desplazamiento horizontal */
@media (hover:hover) and (pointer:fine){
  html body :is(.chips,.seg,.tbl-wrap,.chart-x,#dt1,#dsub){scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  html body :is(.chips,.seg,.tbl-wrap,.chart-x,#dt1,#dsub):hover{scrollbar-color:var(--muted) transparent}
  .chips::-webkit-scrollbar,.seg::-webkit-scrollbar,.tbl-wrap::-webkit-scrollbar,.chart-x::-webkit-scrollbar,.dtabs .t1::-webkit-scrollbar,.dtabs .t2::-webkit-scrollbar{display:block;height:8px}
  .chips::-webkit-scrollbar-thumb,.seg::-webkit-scrollbar-thumb,.tbl-wrap::-webkit-scrollbar-thumb,.chart-x::-webkit-scrollbar-thumb,.dtabs .t1::-webkit-scrollbar-thumb,.dtabs .t2::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  html body .chips{padding-bottom:6px}
}
.hsb{position:fixed;z-index:30;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .15s}
.hsb.on{opacity:1;pointer-events:auto}
.hsb:hover{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.hsb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.hsb{transition:none}}
/* Animación de inicio (misma mecánica que Mind Focus, PowerFit y Lumen) */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease,visibility .45s;animation:pj-auto .01s linear 6s forwards}
#splash.out{opacity:0;visibility:hidden}
#splash.replay,#splash.replay *{animation-name:none!important}
#splash svg{width:min(40vw,170px);height:auto;overflow:visible}
#splash .bx{fill:none;stroke:var(--line);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;animation:pj-draw .9s cubic-bezier(.55,0,.25,1) .05s forwards}
#splash .cr{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:pj-draw .5s ease-out .45s forwards}
#splash .cr.c2{animation-delay:.6s}
#splash .cr.c3{animation-delay:.75s}
#splash .ar{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:pj-draw .45s cubic-bezier(.5,0,.2,1) 1s forwards}
#splash .ar.hd{animation-delay:1.3s;animation-duration:.3s}
#splash .fl{fill:var(--acc);transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:pj-flash .7s ease-out 1.45s both}
#splash .word{font-family:var(--font);font-weight:800;font-size:clamp(28px,8vw,40px);letter-spacing:.06em;line-height:1;color:var(--ink);animation:pj-word .5s ease-out 1.45s both}
#splash .word span{color:var(--acc-ink)}
@keyframes pj-draw{to{stroke-dashoffset:0}}
@keyframes pj-flash{0%{opacity:0;transform:scale(.2)}1%{opacity:.85;transform:scale(.2)}100%{opacity:0;transform:scale(2.6)}}
@keyframes pj-word{from{opacity:0;transform:translateY(12px);letter-spacing:.4em}to{opacity:1;transform:none;letter-spacing:.06em}}
@keyframes pj-auto{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}#splash .fl{opacity:0!important}}
/* Botón flotante y asistente de proyecto nuevo */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px);z-index:25;width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.35);cursor:pointer;transition:transform .15s}
.fab[hidden]{display:none}
/* Pulso constante y suave: dos anillos del color de énfasis salen del botón y se desvanecen */
.fab::before,.fab::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--acc);z-index:-1;animation:fabPulse 2.6s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
.fab::after{animation-delay:1.3s}
@keyframes fabPulse{0%{transform:scale(1);opacity:.5}80%,100%{transform:scale(1.75);opacity:0}}
@media (prefers-reduced-motion:reduce){.fab::before,.fab::after{animation:none;opacity:0}}
.fab:hover{transform:scale(1.06)}
.fab svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
body.desk .fab{bottom:24px;right:24px}
body:has(#instbar:not([hidden])) .fab{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 170px)}
body.desk:has(#instbar:not([hidden])) .fab{bottom:24px;right:490px}
body.wizon{overflow:hidden}
.wiz{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:stretch;justify-content:center}
.wiz[hidden]{display:none}
.wzbox{background:var(--bg);width:100%;max-width:640px;display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.wiz{align-items:center}.wzbox{height:min(92vh,860px);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}}
.wzhead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.wzprog{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.wzprog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
.wzbody{flex:1;overflow-y:auto;padding:20px 18px;display:grid;gap:14px;align-content:start}
.wzbody h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.wzq{margin:0;font-size:16px;line-height:1.45}
.wzhelp{background:var(--panel);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.wzhelp p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.wzfields{display:grid;gap:12px}
.wzfields .f label{font-size:13px}
.wzfields input{font-size:17px}
.wzerr{margin:0;color:var(--neg);font-weight:700;min-height:1em}
.wzfoot{display:flex;justify-content:space-between;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.wzfoot .btn{min-width:120px;padding:13px 18px;font-size:15px}
.wzopts{display:grid;gap:8px}
.wzopt{display:grid;gap:2px;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink);font:inherit}
.wzopt span{color:var(--muted);font-size:13px}
.wzopt[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft)}
.wzsw{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border-radius:14px;padding:14px 16px;cursor:pointer}
.wzsw input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:2px}
.wzsw span{display:grid;gap:2px}.wzsw small{color:var(--muted)}
.wztipos{display:grid;gap:10px}
.wzets{display:grid;gap:12px;margin-bottom:10px}
.wzet{background:var(--panel);border-radius:14px;padding:12px;display:grid;gap:10px}
.wztorre{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:end}
.wztorre>b{align-self:center;font-size:13px}
.wzet>.btn{justify-self:start}
.wztipo{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;background:var(--panel);border-radius:14px;padding:10px}
@media (max-width:480px){.wztipo{grid-template-columns:1fr 1fr}.wztipo .f:first-child{grid-column:1/-1}}
.wzcalc{background:var(--panel);border-radius:14px;padding:12px 16px;display:grid;gap:4px}
.wzcalc div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.wzcalc small{color:var(--muted)}
.wzverdict{border-radius:16px;padding:16px;display:grid;gap:4px}
.wzverdict b{font-size:18px}
.wzverdict.ok{background:var(--acc);color:var(--on-acc)}
.wzverdict.no{background:var(--neg-soft);color:var(--neg)}
.wzverdict span{font-size:14px;line-height:1.45}
.wzkpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wzkpis div{background:var(--panel);border-radius:14px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.wzkpis span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wzkpis b{font-size:16px}
.wzsugs{display:grid;gap:8px}
.wzsug{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.wzsug div{display:grid;gap:2px;min-width:0}
.wzsug span{font-size:14px}.wzsug small{color:var(--muted);font-size:12.5px;line-height:1.4}
.wzsug.best{background:var(--acc-soft);border:0;border-radius:12px;padding:12px}
.wzsug .btn{flex:none}
/* Ayuda: manual y glosario */
.hsteps{display:grid;gap:8px}
.hstep{background:var(--sunk);border-radius:var(--r-sm)}
.hstep summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
.hstep summary::-webkit-details-marker{display:none}
.hstep summary .grow{flex:1;min-width:0}
.hstep summary b{display:block;font-size:14px}
.hstep summary small{display:block;color:var(--muted);font-size:12px}
.hstep summary svg{transition:transform .2s;flex:none;color:var(--muted)}
.hstep[open] summary svg{transform:rotate(90deg)}
.hnum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-weight:800;font-size:13px}
.hstep ul{margin:0;padding:0 16px 4px 54px;display:grid;gap:6px;font-size:13.5px;line-height:1.45}
.hstep .btn{margin:8px 14px 14px 54px}
.glos{margin:0;display:grid;gap:2px}
.glos>div{padding:10px 0;border-top:1px solid var(--line)}
.glos>div:first-child{border-top:0}
.glos dt{font-weight:800;font-size:14px}
.glos dd{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.glos-g h3{margin:14px 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-ink)}
.glos-g h3 .muted{font-weight:600;letter-spacing:0}
.glos>div.on{background:var(--acc-soft);border-radius:10px;padding-left:10px;padding-right:10px;transition:background .2s}
/* Solicitudes de acceso */
[data-go="cuenta"][data-badge]{position:relative}
[data-go="cuenta"][data-badge]::after{content:attr(data-badge);position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--neg);color:#fff;font-size:10.5px;font-weight:800;line-height:17px;text-align:center;box-sizing:border-box}
#dt1 [data-go="cuenta"][data-badge]::after{position:static;display:inline-block;margin-left:2px}
.reqs{display:grid;gap:2px}

.instbar .ir span{display:block;font-size:13px;color:var(--muted)}
.instbar ol{margin:0;padding-left:20px;font-size:13.5px;display:grid;gap:4px}
.instbar .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.desk .instbar{left:auto;right:20px;bottom:20px;transform:none}
/* Comparar proyectos */
.cmpsel{display:flex;gap:6px;flex-wrap:wrap}
.cmpsel .chip{display:inline-flex;align-items:center;gap:7px}
.cmpsel .chip i,.cmpn i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--panel)}
.cmpt th.cmph{vertical-align:bottom;text-align:right;white-space:normal;min-width:130px}
.cmph .cmpn{display:flex;align-items:center;justify-content:flex-end;gap:6px;color:var(--ink);font-size:12.5px;font-weight:800}
.cmph small{display:block;font-weight:600;color:var(--muted)}
.cmph small.cur{color:var(--acc-ink);font-weight:800}
.cmph .lnk{padding:2px 0;font-size:12px}
.cmpt tr.sec td{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted);padding-top:14px}
.cmpt td.best{color:var(--acc-ink);font-weight:800}
.cmpt .win{display:inline-block;margin-left:5px;font-size:11px}
.rank{display:grid;gap:22px}
@container scr (min-width:760px){.rank{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmpt th.c0,.cmpt td.c0{position:sticky;left:0;z-index:2;background:var(--panel)}
.cmpt th.c0{z-index:3}
.hsc{font-size:16px}.hsc.ok{color:var(--acc-ink)}.hsc.warn{color:var(--warn)}.hsc.crit{color:var(--neg)}
/* Inicio: bloques y tablero técnico */
.blk{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:10px;margin-top:10px}
.blk::after{content:"";flex:1;height:1px;background:var(--line)}
.hscore{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-sm);background:var(--sunk);margin-bottom:10px}
.hscore b{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:proportional-nums}
.hscore span{display:grid;font-size:12px;color:var(--muted)}
.hscore strong{font-size:14px;color:var(--ink)}
.hscore.ok b{color:var(--acc-ink)}.hscore.warn b{color:var(--warn)}.hscore.crit b{color:var(--neg)}
.hrows{display:grid}
.hrow{border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow summary{display:grid;grid-template-columns:100px minmax(0,1fr);grid-template-areas:"p n" "p v";column-gap:12px;align-items:center;padding:8px 0;cursor:pointer;list-style:none}
.hrow summary::-webkit-details-marker{display:none}
.hc{margin:0 0 10px 112px;font-size:12px;color:var(--muted)}
.hrow .pill{grid-area:p}
.hn{grid-area:n;font-weight:700;font-size:13px}
.hv{grid-area:v;font-size:12px;color:var(--muted);min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;justify-self:start;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;padding:3px 9px 3px 7px;border-radius:99px;white-space:nowrap}
.pill svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pill.ok{background:var(--acc);color:var(--on-acc)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--neg-soft);color:var(--neg)}
.su{display:grid;gap:20px}

.sut{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px}

.bar.mix>span:first-child{display:grid;line-height:1.25;min-width:0}

.bar.mix small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- Calendario e índices macro ---- */
function makeCal(P,M,H){
  const [y0,m0]=String(P.general.fecha||'2027-01').split('-').map(Number);
  const year=t=>y0+Math.floor(((m0||1)-1+t)/12);
  const month=t=>(((m0||1)-1+t)%12+12)%12;
  const rateY=(arr,y)=>{const i=Math.max(0,Math.min(arr.length-1,y-M.anioBase));return pc(arr[i])};
  const iccv=[1],infl=[1];
  for(let t=1;t<H;t++){iccv[t]=iccv[t-1]*Math.pow(1+rateY(M.iccv,year(t)),1/12);infl[t]=infl[t-1]*Math.pow(1+rateY(M.inflacion,year(t)),1/12)}
  const smCache={};
  const smmlvY=y=>{if(smCache[y])return smCache[y];let v=M.smmlv;for(let k=M.anioBase+1;k<=y;k++)v*=1+rateY(M.incSmmlv,k);return smCache[y]=v};
  const ibrM=(t,spread)=>Math.pow(1+rateY(M.ibr,year(t))+pc(spread),1/12)-1;
  return {year,month,iccv,infl,smmlv:t=>smmlvY(year(t)),ibrM};
}
function scurve(n){const F=x=>x*x*(3-2*x),w=[];for(let i=0;i<n;i++)w.push(F((i+1)/n)-F(i/n));return w}

/* ---- Torres ----
   Las torres de una misma etapa se venden y se construyen a la vez; solo cambian sus pisos y sus unidades. Por eso el
   calendario, la caja y el crédito siguen siendo de la etapa, y las torres solo definen la prima por piso promedio:
   la de cada torre (unidad promedio a media altura) ponderada por sus unidades. Sin torres se usan los pisos de la etapa. */
const torresDe=E=>(Array.isArray(E.torres)?E.torres:[]).filter(Boolean);
function pisosMax(E){const T=torresDe(E);return T.length?Math.max(1,...T.map(x=>+x.pisos||1)):Math.max(1,+E.pisos||1)}
function pisoFactor(E,prima){const T=torresDe(E),f=p=>1+prima*(Math.max(1,+p||1)-1)/2;if(!T.length)return f(E.pisos);
  const tot=sum(T.map(x=>Math.max(0,+x.unidades||0)));return sum(T.map(x=>(tot>0?Math.max(0,+x.unidades||0)/tot:1/T.length)*f(x.pisos)))}

function runEtapa(P,E,M,cal,H){

  const unitBase=t=>(t.clase==='parq'||t.clase==='deposito')?(+t.precio||0):(+t.area||0)*(+t.precio||0)*pisoFactor(E,pc(t.primaPiso))*(1+pc(t.pctVista)*pc(t.primaVista));
  const t0=Math.max(0,Math.round(+E.inicioVentas||0));
  const vel=t=>{const k=t-t0,b=Math.max(.2,+E.velocidad||1);
    if(E.curva==='personalizada'&&Array.isArray(E.curvaPers)&&E.curvaPers[k]!=null&&E.curvaPers[k]!=='')return Math.max(0,+E.curvaPers[k]);
    if(E.curva==='lanzamiento')return b*(k<3?1.8:k<6?1.25:.85);

  const nO=Math.max(1,Math.round(+E.mesesObra||1)),nE=Math.max(1,Math.round(+E.mesesEsc||1));

  const pe=Math.min(100,Math.max(1,+E.pe||60));

      tips.forEach(tp=>{const share=u/UA*(+tp.unidades||0);let p=unitBase(tp)*escal;
        if(isVis&&tp.clase==='apto'){const cap=tope*cal.smmlv(t);if(p>cap){p=cap;capped=true}}
        val+=share*p;if(tp.clase==='apto'||!apt.length)units+=share});

      const febs=ms.filter(m=>cal.month(m)===1),pri=ms.filter(m=>cal.month(m)===5||cal.month(m)===11);
      let ces=rest*pc(V.pctCesantias),prm=rest*pc(V.pctPrimas),mon=rest-ces-prm;
      if(!febs.length){mon+=ces;ces=0}if(!pri.length){mon+=prm;prm=0}
      febs.forEach(m=>add(m,ces/febs.length));pri.forEach(m=>add(m,prm/pri.length));
      if(ms.length)ms.forEach(m=>add(m,mon/ms.length));else add(s,mon);
    }
    let paidD=0;
    Object.keys(sched).forEach(k=>{const m=+k,v=sched[m];ciCol[m]+=v*(1-dz);if(dz>0&&m<s+kD){ciCol[m]+=v*dz;paidD+=v*dz}});

      let sb=0;if(isVis){const su=pc(V.subsidioPct)*(+V.subsidioSMMLV||0)*cal.smmlv(m)+pc(V.cajaPct)*(+V.cajaSMMLV||0)*cal.smmlv(m);sb=Math.min(portion,uu*su)}

  const fid=z(),ciRel=z(),rend=z(),refCash=z();const rf=Math.pow(1+pc(FI.rendFid),1/12)-1;

  lic[Math.max(0,io-1)]+=cdBase*pc(C.licencias.delineacion);

  const VG=sum(valGross);const lastV=Math.max(t0,lastSale);
  spread(pub,Math.max(0,t0-2),lastV,VG*pc(C.publicidad));
  for(let m=0;m<H;m++){com[m]=valGross[m]*pc(C.comision);gEsc[m]=rev[m]*pc(C.gastosEscr)}
  let lastEsc=e1;for(let m=H-1;m>=0;m--)if(escU[m]>1e-9){lastEsc=m;break}
  spread(ger,p0,lastEsc,VG*pc(C.gerencia));
  spread(post,fo+1,fo+12,CDt*pc(C.postventa));

function irr(f){
  if(!f.some(x=>x>1)||!f.some(x=>x<-1))return null;
  const npv=r=>{let s=0,d=1;for(let i=0;i<f.length;i++){s+=f[i]/d;d*=1+r}return s};
  const bis=(lo,hi)=>{let flo=npv(lo);for(let k=0;k<80;k++){const m=(lo+hi)/2,fm=npv(m);if(flo*fm<=0)hi=m;else{lo=m;flo=fm}}return (lo+hi)/2};
  const st=0.004;let p=0,fp=npv(0);if(fp===0)return 0;
  for(let r=st;r<=1.2;r+=st){const fr=npv(r);if(fp*fr<=0)return bis(p,r);p=r;fp=fr}
  p=0;fp=npv(0);
  for(let r=-st;r>=-0.35;r-=st){const fr=npv(r);if(fp*fr<=0)return bis(r,p);p=r;fp=fr}
  return null;
}

    if(!P.tipologias.some(t=>t.etapa===e.E.id))a.push(['crit','Producto',`${e.E.nombre} no tiene tipologías.`])});
  if(R.expo/R.ventas>.25)a.push(['warn','Aportes',`Los socios deben aportar hasta ${fM(R.expo)}, ${fP(R.expo/R.ventas)} de las ventas.`]);
  const lt=R.tot.lote/R.ventas;if(lt>.2)a.push(['warn','Lote',`El lote pesa ${fP(lt)} de las ventas; lo usual es 10–18 %.`]);
  const sp=sum((P.socios||[]).map(s=>+s.part||0));if(P.socios&&P.socios.length&&Math.abs(sp-100)>.01)a.push(['crit','Socios',`Las participaciones suman ${nf(sp,1)} %, deben sumar 100 %.`]);
  if(P.costos.lote.forma==='especie'&&!(P.socios||[]).some(s=>s.aportaLote))a.push(['warn','Lote',`El lote es aporte en especie pero ningún socio está marcado como aportante; se repartió entre todos.`]);
  if(R.maxDif>1000)a.push(['crit','Balance',`El balance proyectado no cuadra por ${fM(R.maxDif)}.`]);
  const sg=segData();if(sg&&sg.cpi!=null&&sg.cpi<.95)a.push(['warn','Costos',`Al corte, el costo real va ${fP(1/sg.cpi-1)} por encima del valor ganado (CPI ${nf(sg.cpi,2)}).`]);
  if(!a.length)a.push(['ok','En rango','Margen, TIR, preventa, aportes y balance dentro de los parámetros definidos.']);
  return a;
}

/* Modo Escritorio: Inicio en mosaico de dos columnas sin huecos. Cada tarjeta, en orden, va a la columna más corta.
   Los títulos de bloque se ocultan y cada tarjeta muestra su tema (Salud, Económico…) como etiqueta */
function masonInicio(){
  const g=$('#s-inicio .grid2');if(!g)return;
  const items=[...g.querySelectorAll(':scope>.mcol>*')].concat([...g.children].filter(e=>!e.classList.contains('mcol')));
  items.forEach((e,i)=>{if(e.dataset.o==null)e.dataset.o=i});items.sort((a,b)=>a.dataset.o-b.dataset.o);
  g.querySelectorAll(':scope>.mcol').forEach(c=>c.remove());g.classList.remove('mason');items.forEach(e=>g.appendChild(e));
  if(!(ST.desk&&innerWidth>=1024))return;
  let topic='';items.forEach(e=>{if(e.classList.contains('blk'))topic=e.textContent;else if(topic)e.dataset.topic=topic});
  const cols=[0,1].map(()=>{const c=document.createElement('div');c.className='mcol';g.appendChild(c);return c});g.classList.add('mason');
  items.forEach(e=>{if(e.classList.contains('blk')){cols[0].appendChild(e);return}const c=cols[0].offsetHeight<=cols[1].offsetHeight?cols[0]:cols[1];c.appendChild(e)});
}

function ttsPlay(items,h){ttsStop();if(!('speechSynthesis' in window)){toast('Tu navegador no permite leer en voz alta');return false}
  const Q=[];items.forEach(it=>{const cs=wzChunks(it.t);cs.forEach((c,k)=>Q.push({t:c,i:it.i,first:k===0,pause:k===cs.length-1?it.pause||120:120}))});if(!Q.length)return false;
  TTS.h=h||{};let my=TTS.gen,qi=0,started=false;
  const end=()=>{if(my!==TTS.gen)return;TTS.gen++;const f=TTS.h;TTS.h=null;if(f&&f.onEnd)f.onEnd()};
  const next=()=>{if(my!==TTS.gen)return;if(qi>=Q.length){end();return}const q=Q[qi];if(q.first&&TTS.h.onItem)TTS.h.onItem(q.i);

function wzApply(k,f){const a=WZ.a;
  // Los aumentos se redondean hacia arriba y las reducciones hacia abajo, para no quedar justo por debajo del límite
  if(k==='precio'||k==='mix')a.precio=Math.ceil(a.precio*(k==='mix'?1+0.12*f:f)/1000)*1000;
  if(k==='lote'||k==='mix')a.lote=Math.floor(a.lote*(k==='mix'?1-0.35*f:f)/1e6)*1e6;
  if(k==='costo'||k==='mix')a.costo=Math.floor(a.costo*(k==='mix'?1-0.12*f:f)/1000)*1000;
  if(k==='vel'||k==='mix')a.vel=Math.ceil(a.vel*(k==='mix'?1+0.4*f:f)*10)/10;
  wzStop();WZ.opt=null;wzRender();const ok=wzViable(WZ.P,WZ.R);toast(ok?'Ajuste aplicado: el proyecto ya es viable':'Ajuste aplicado; revisa las demás sugerencias');wzAuto()}

async function wipeData(){

    if(ST.mode==='fb'&&ST.fbCol){const sn=await ST.fbCol.get();const docs=sn.docs.filter(d=>/^(p_|v_)/.test(d.id));
      for(let i=0;i<docs.length;i+=400){const b=FB.db.batch();docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
    Object.keys(Local.all()).forEach(id=>Local.del(id));LS.set('pp.projects',{});prefs.last=null;savePrefs();
    toast('Datos borrados');setTimeout(()=>location.reload(),700);
  }catch(err){console.warn(err);toast('No se pudieron borrar los datos. Revisa tu conexión.');ST.askWipe=false;rr('cuenta')}
}

    <button class="btn pri" type="submit" id="aBtn" style="width:100%;padding:13px">${T[1]}</button>
   </form>
   ${m==='login'?`<button class="lnk" data-auth="reset">¿Olvidaste tu contraseña?</button><p class="muted" style="text-align:center;margin:0">¿No tienes cuenta? <button class="lnk" data-auth="register">Crear cuenta</button></p><p class="muted" style="text-align:center;margin:0;font-size:12.5px">Si ya usas Mind Focus o PowerFit, entra con la misma cuenta.</p>`
    :`<p class="muted" style="text-align:center;margin:0"><button class="lnk" data-auth="login">Volver a iniciar sesión</button></p>`}`;
}
function hideAuth(){$('#auth').hidden=true;document.body.classList.remove('authing');if(!ST.ready)$('#s-loading').hidden=false}
function showNoAccess(u){hideSplash();const a=$('#auth');a.hidden=false;document.body.classList.add('authing');
  $('#authBody').innerHTML=`<h2>Sin acceso</h2><p class="muted" style="margin:0">El acceso de ${esc(u&&u.email||'esta cuenta')} a las apps de Planificar Proyectos está desactivado. Escríbele al administrador para reactivarlo.</p><button class="btn" data-act="logout" style="width:100%;padding:13px">Cerrar sesión</button>`}
function authErr(e){const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Correo o contraseña incorrectos.';
  if(c==='auth/email-already-in-use')return 'Ya existe una cuenta con ese correo. Inicia sesión.';
  if(c==='auth/weak-password')return 'La contraseña debe tener al menos 6 caracteres.';
  if(c==='auth/invalid-email'||c==='auth/missing-email')return 'Revisa que el correo esté bien escrito.';
  if(c==='auth/too-many-requests')return 'Demasiados intentos. Espera unos minutos e intenta de nuevo.';
  if(c==='auth/network-request-failed')return 'Sin conexión. Revisa tu internet.';
  return 'No se pudo completar. Intenta de nuevo.'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-auth]');if(b){e.preventDefault();ST.authEmail=($('#aEmail')||{}).value||ST.authEmail;showAuth(b.dataset.auth)}});
document.addEventListener('submit',e=>{if(e.target.id!=='authForm')return;e.preventDefault();
  const m=ST.authMode||'login',em=($('#aEmail').value||'').trim(),msg=$('#aMsg'),btn=$('#aBtn'),p=$('#aPass'),p2=$('#aPass2');ST.authEmail=em;
  const show=(t,ok)=>{msg.textContent=t;msg.className='amsg'+(ok?' ok':'')};
  if(!em)return show('Escribe tu correo.');
  if(m!=='reset'&&(!p.value||p.value.length<6))return show('La contraseña debe tener al menos 6 caracteres.');
  if(m==='register'&&p.value!==p2.value)return show('Las contraseñas no coinciden.');
  const label=btn.textContent;btn.disabled=true;btn.textContent='Un momento…';
  const job=m==='login'?FB.auth.signInWithEmailAndPassword(em,p.value):m==='register'?FB.auth.createUserWithEmailAndPassword(em,p.value):FB.auth.sendPasswordResetEmail(em,{url:SITE_URL});
  job.then(()=>{if(m!=='reset')loginPending=true;if(m==='reset'){show('Te enviamos un correo para restablecer tu contraseña.',true);btn.disabled=false;btn.textContent=label}})
     .catch(err=>{show(authErr(err));btn.disabled=false;btn.textContent=label});
});
init();

</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
