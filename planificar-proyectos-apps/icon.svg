<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#04141b"/>
  <!-- Logo Planificar Proyectos (centrado, ligeramente arriba para dar espacio al engranaje) -->
  <g transform="translate(13 9) scale(0.02)">
    <path fill="#cdfc54" fill-rule="evenodd" d="M0,478L826,0L910,49L910,573L167,1003L167,1335L371,1453L371,1120L1115,692L1115,263L1198,215L1653,478L1653,1432L826,1909L743,1860L743,1335L1486,907L1486,573L1282,456L1282,788L538,1217L538,1637L455,1686L0,1432ZM167,573L743,241L743,478L167,810ZM910,1432L1486,1099L1486,1335L910,1667Z"/>
  </g>
  <!-- Engranaje pequeño abajo derecha (13x13 px, centro en 53,53) -->
  <g transform="translate(53,53)">
    <circle r="3.2" fill="#04141b"/>
    <circle r="3.2" fill="none" stroke="#cdfc54" stroke-width="2.2"/>
    <!-- Dientes del engranaje -->
    <g fill="#cdfc54">
      <!-- 8 dientes -->
      <rect x="-1.2" y="-6.5" width="2.4" height="2.2" rx="0.4"/>
      <rect x="-1.2" y="4.3" width="2.4" height="2.2" rx="0.4" transform="rotate(180)"/>
      <rect x="-1.2" y="-6.5" width="2.4" height="2.2" rx="0.4" transform="rotate(45)"/>
      <rect x="-1.2" y="-6.5" width="2.4" height="2.2" rx="0.4" transform="rotate(90)"/>
      <rect x="-1.2" y="-6.5" width="2.4" height="2.2" rx="0.4" transform="rotate(135)"/>
      <rect x="-1.2" y="-6.5" width="2.4" height="2.2" rx="0.4" transform="rotate(225)"/>
      <rect x="-1.2" y="-6.5" width="2.4" height="2.2" rx="0.4" transform="rotate(270)"/>
      <rect x="-1.2" y="-6.5" width="2.4" height="2.2" rx="0.4" transform="rotate(315)"/>
    </g>
    <!-- Círculo central del engranaje -->
    <circle r="1.8" fill="#04141b"/>
