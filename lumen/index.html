/* Layout: una columna tipo app móvil (máx 480px), navegación fija abajo con botón central "Hoy". Misma base que PowerFit/Mind Focus. */
:root{
  color-scheme:dark;
  --bg:#111315; --surface:#1C1F22; --surface2:#2A2E32; --line:#3A3F44;
  --fg:#F2F2EE; --muted:#A3A8AD; --soft:#D9DAD5;
  --accent:#C6F432; --accent-fg:#C6F432; --accent-ink:#111315; --ok:#5BB585;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F2EE; --surface:#FFFFFF; --surface2:#ECEBE6; --line:#D6D4CD;
  --fg:#17191B; --muted:#5E6368; --soft:#33373A; --ok:#2E7D55; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F2EE; --surface:#FFFFFF; --surface2:#ECEBE6; --line:#D6D4CD;
  --fg:#17191B; --muted:#5E6368; --soft:#33373A; --ok:#2E7D55; color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;line-height:1.02;text-wrap:balance}
h1{font-size:34px}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.5px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.label.ac{color:var(--accent-fg)}
.panel{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.big{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;color:var(--accent-fg)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--fg)}
.btn{min-height:52px;border-radius:16px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.ghost{background:transparent;border:2px solid var(--accent);color:var(--accent-fg)}
.btn.soft{background:var(--surface2);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid #E86A62;color:#E86A62}
.say{display:inline-flex;align-items:center;gap:6px;border:none;background:var(--surface2);color:var(--fg);border-radius:999px;min-height:36px;padding:0 14px;font-size:13px;font-weight:700;flex-shrink:0}
.say svg{color:var(--accent-fg)}
.say.on{background:var(--accent);color:var(--accent-ink)}
.say.on svg{color:var(--accent-ink)}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border:none;text-align:left;width:100%}
.hero .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.hero h3{font-size:30px;text-transform:uppercase}
.hero .go{width:48px;height:48px;border-radius:50%;background:var(--accent-ink);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}

.dot{width:34px;height:34px;margin:0 auto;border-radius:50%;background:var(--surface2)}
.dot.on{background:var(--accent)}

.dot.today.on{background:var(--accent);border:none}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 12px;min-height:58px}
.item .t{width:66px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.check{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg{display:grid;gap:4px;background:var(--surface);border-radius:14px;padding:4px}
.seg button{min-height:40px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.bars{display:flex;gap:6px}
.bars i{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;display:block}
.bars i b{display:block;height:100%;background:var(--accent);border-radius:4px}
.beads{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;min-height:40px}
.beads i{display:block;width:18px;height:18px;border-radius:50%;background:var(--surface2)}
.beads i.pn{width:26px;height:26px;margin-right:4px}
.beads i.on{background:var(--accent)}
.counter{display:flex;align-items:baseline;justify-content:center;gap:8px}
.counter b{font-family:var(--f-display);font-size:84px;line-height:1;color:var(--accent-fg)}
.counter span{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--muted)}
.prayer{background:var(--surface);border-radius:20px;padding:16px;color:var(--soft);line-height:1.55;display:flex;flex-direction:column;gap:12px}
.ctl{display:flex;gap:10px}
.ctl .icon-btn{width:72px;height:72px;border-radius:22px;background:transparent;border:1px solid var(--line)}
.ctl .btn{min-height:72px;border-radius:22px;font-size:18px}
.quote{background:var(--surface);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.quote p{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.12}
.quote .q{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.6;color:var(--accent-fg);height:28px}
.ref{font-size:14px;font-weight:700;color:var(--accent-fg)}
.kv{display:flex;justify-content:space-between;gap:10px;padding-block:6px;border-bottom:1px solid var(--surface2)}
.kv:last-child{border-bottom:none}
.sample{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;min-height:48px;color:var(--muted)}
.field input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--fg);font-size:15px;min-height:46px}
.field:focus-within{outline:2px solid var(--accent)}
.inp{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:12px;color:var(--fg)}
.inp:focus{border-color:var(--accent);outline:none}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;font-size:11px;color:var(--muted);padding:0}
.sw i{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#111315;box-shadow:0 0 0 2px var(--surface)}
.sw.on i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.sw.on{color:var(--fg);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.book{background:var(--surface);border:none;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;min-height:44px}
.acc summary::-webkit-details-marker{display:none}
.acc[open] summary svg{transform:rotate(180deg)}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);border-top:1px solid var(--surface2)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:76px}
nav.tabs button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500}
nav.tabs button.on{color:var(--accent-fg);font-weight:700}
nav.tabs .hoy{justify-content:flex-start;margin-top:-28px;color:var(--fg);font-weight:700}
nav.tabs .hoy span{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:4px solid var(--bg);display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.installbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:40;width:calc(100% - 32px);max-width:448px;background:var(--surface);border:1px solid var(--accent-fg);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px}
.installbar.low{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.installbar ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.link{background:none;border:none;color:var(--muted);font-weight:700;font-size:14px;min-height:44px;padding:0 6px}
.full{min-height:100%;justify-content:center;padding-block:24px}
/* Animación de inicio (misma mecánica que Mind Focus) */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash.replay *{animation-name:none!important}
#splash svg{width:min(44vw,180px);height:auto;overflow:visible}
#splash .br{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:lm-draw 1s cubic-bezier(.55,0,.25,1) .05s forwards}
#splash .cr{fill:none;stroke:var(--fg);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:lm-draw .55s ease-out .55s forwards}
#splash .cr.c2{animation-delay:.85s;animation-duration:.4s}
#splash .ry{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;transform-box:view-box;transform-origin:24px 24px;opacity:0;animation:lm-spin 1.1s cubic-bezier(.2,.8,.25,1.15) 1s forwards}
#splash .fl{fill:var(--accent);transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:lm-flash .7s ease-out 1.35s both}
#splash .word{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,9vw,44px);letter-spacing:3px;line-height:1;color:var(--fg);animation:lm-word .5s ease-out 1.4s both}
#splash .word span{color:var(--accent-fg)}
@keyframes lm-draw{to{stroke-dashoffset:0}}
@keyframes lm-spin{0%{opacity:1;transform:rotate(-360deg) scale(.6)}100%{opacity:1;transform:none}}
@keyframes lm-flash{0%{opacity:0;transform:scale(.2)}1%{opacity:.85;transform:scale(.2)}100%{opacity:0;transform:scale(2.6)}}
@keyframes lm-word{from{opacity:0;transform:translateY(12px);letter-spacing:10px}to{opacity:1;transform:none;letter-spacing:3px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}#splash *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}#splash .fl{opacity:0!important}}
</style>

</head>

  +(list.length?'<div class="books">'+list.map(function(b){ return '<button class="book" data-a="book" data-v="'+esc(b[0])+'"><b>'+b[0]+'</b><span class="small muted">'+b[1]+' capítulos</span></button>'; }).join('')+'</div>':'<div class="empty muted">Ningún libro coincide con “'+esc(U.q)+'”.</div>')
  +'<p class="sample">El texto bíblico completo se integrará en la fase de publicación.</p>';
}

function vMe(){
 var vs=voices();
 return '<header><h1>PERFIL</h1></header>'
  +'<div class="panel"><label class="label" for="nm">Tu nombre</label><input class="inp" id="nm" data-a="name" value="'+esc(S.name)+'" placeholder="¿Cómo te llamas?" autocomplete="given-name"></div>'
  +'<div class="panel"><span class="label">Apariencia</span>'
  +'<div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface2)"><button class="'+(S.mode==='dark'?'on':'')+'" data-a="mode" data-v="dark">Oscuro</button><button class="'+(S.mode==='light'?'on':'')+'" data-a="mode" data-v="light">Claro</button></div>'
  +'<span class="small muted">Color de acento</span><div class="swatches">'+Object.keys(ACCENTS).map(function(k){ var c=ACCENTS[k], on=S.accent===k; return '<button class="sw'+(on?' on':'')+'" data-a="accent" data-v="'+k+'" aria-pressed="'+on+'" aria-label="'+c[0]+'"><i style="background:'+c[1]+'">'+(on?ic('check',18,3):'')+'</i>'+c[0]+'</button>'; }).join('')+'</div></div>'
  +'<div class="panel"><span class="label">Lectura en voz alta</span>'
  +(TTS?'<label class="small muted" for="vsel">Voz</label><select class="inp" id="vsel" data-a="voice">'+'<option value="">Automática (recomendada)</option>'+(vs.length?vs.map(function(v){ return '<option value="'+esc(v.name)+'"'+(v.name===S.voice?' selected':'')+'>'+esc(v.name)+' ('+v.lang+')</option>'; }).join(''):'')+'</select>'
   +'<div class="between"><label class="small muted" for="rate">Velocidad</label><span class="small num" id="rateV">'+S.rate.toFixed(1)+'×</span></div><input type="range" id="rate" data-a="rate" min="0.6" max="1.4" step="0.1" value="'+S.rate+'">'
   +'<div>'+sayBtn('test','Probar voz')+'</div>'
   :'<p class="small muted">Este navegador no permite lectura en voz alta. Prueba con Chrome o Safari.</p>')
  +'</div>'
  +'<div class="panel"><span class="label">Instalar como app</span>'+(Inst.standalone()?'<p class="small muted">Lumen ya está instalada en este dispositivo.</p>':Inst.can()?Inst.body(false):'<p class="small muted">Abre esta página en Chrome (Android) o Safari (iPhone) y usa "Agregar a pantalla de inicio" o "Instalar app".</p>')+'</div>'
  +(Cloud.user?'<div class="panel"><span class="label">Cuenta</span><p class="small" style="overflow-wrap:anywhere">'+esc(Cloud.user.email)+'</p><div class="grid2"><button class="btn soft" data-a="resetPass">Cambiar contraseña</button><button class="btn soft" data-a="logout">Cerrar sesión</button></div><p class="small muted">Es la misma cuenta de Mind Focus y PowerFit.</p></div>':'')
  +'<div class="panel"><span class="label">Tus datos</span><p class="small muted">'+(Cloud.user?'Se guardan en tu cuenta y en este dispositivo.':'Se guardan en este dispositivo.')+'</p>'
  +(U.confirmReset?'<p class="small">¿Borrar racha, rutina y progreso del Rosario?</p><div class="grid2"><button class="btn soft" data-a="resetNo">Cancelar</button><button class="btn danger" data-a="resetYes">Sí, borrar</button></div>':'<button class="btn danger" data-a="reset">Borrar mis datos</button>')
  +'</div>';
}

/* ---------- Instalar como app ---------- */
var Inst={prompt:null,
 standalone:function(){ try{ return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; }catch(e){ return false; } },
 ios:function(){ var u=navigator.userAgent||''; return /iphone|ipad|ipod/i.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); },
 can:function(){ return !this.standalone()&&(!!this.prompt||this.ios()); },
 dismissed:function(){ try{ return Date.now()-(+localStorage.getItem('lumen:installDismiss')||0)<7*864e5; }catch(e){ return false; } },
 body:function(inBar){
  if(this.prompt) return '<div class="row">'+logo(40)+'<div class="stack" style="gap:2px;flex:1;min-width:0"><b>Instala Lumen</b><span class="muted small">Ábrela desde tu pantalla de inicio, a pantalla completa y más rápido.</span></div></div>'+
   '<div class="grid2">'+(inBar?'<button class="btn soft" data-a="instNo">Ahora no</button>':'')+'<button class="btn" data-a="instGo"'+(inBar?'':' style="grid-column:1/-1"')+'>Instalar</button></div>';
  return '<div class="row">'+logo(40)+'<div class="stack" style="gap:2px;flex:1;min-width:0"><b>Instala Lumen en tu iPhone</b><span class="muted small">En Safari:</span></div></div>'+
   '<ol><li>Toca <b>Compartir</b> (el cuadro con la flecha hacia arriba).</li><li>Elige <b>Agregar a pantalla de inicio</b> y luego <b>Agregar</b>.</li></ol>'+
   (inBar?'<button class="btn soft" data-a="instNo">Entendido</button>':'');
 },
 show:function(){ var el=document.getElementById('install'); if(!el) return;
  var sp=document.getElementById('splash');
  var on=this.can()&&!this.dismissed()&&!needAuth()&&(!sp||sp.classList.contains('out'));
  if(!on){ el.hidden=true; return; }
  el.innerHTML=this.body(true); el.hidden=false; }
};
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); Inst.prompt=e; Inst.show(); if(U.tab==='me') render(); });
window.addEventListener('appinstalled',function(){ Inst.prompt=null; document.getElementById('install').hidden=true; toast('Lumen quedó instalada'); if(U.tab==='me') render(); });

function needAuth(){ return !!Cloud.auth&&(!Cloud.user||Cloud.wait); }
function brandBig(){ return '<span class="row" style="gap:10px;justify-content:center">'+logo(52)+'<span style="font-family:var(--f-display);font-weight:700;font-size:38px;letter-spacing:3px">LU<span style="color:var(--accent-fg)">MEN</span></span></span>'; }
function vAuth(){
 if(Cloud.wait) return '<div class="stack full" style="align-items:center">'+brandBig()+'<p class="muted">Cargando…</p></div>';
 var m=U.authMode||'login';
 var T={login:['Inicia sesión','Entrar'],register:['Crea tu cuenta','Crear cuenta'],reset:['Recupera tu contraseña','Enviar correo']}[m];
 return '<div class="stack full" style="gap:20px">'+
  '<div class="stack" style="align-items:center;text-align:center;gap:10px">'+brandBig()+'<p class="muted">Reza, lee y vive tu fe cada día. Todo queda guardado en tu cuenta.</p></div>'+
  '<form id="authForm" class="panel" novalidate><h2>'+T[0]+'</h2>'+
  '<label class="stack" style="gap:6px" for="aEmail"><span class="label">Correo</span><input class="inp" id="aEmail" type="email" autocomplete="email" inputmode="email" required style="font-size:16px" value="'+esc(U.authEmail||'')+'"></label>'+
  (m!=='reset'?'<label class="stack" style="gap:6px" for="aPass"><span class="label">Contraseña</span><input class="inp" id="aPass" type="password" autocomplete="'+(m==='register'?'new-password':'current-password')+'" required minlength="6" style="font-size:16px"></label>':'')+
  (m==='register'?'<label class="stack" style="gap:6px" for="aPass2"><span class="label">Repite la contraseña</span><input class="inp" id="aPass2" type="password" autocomplete="new-password" required minlength="6" style="font-size:16px"></label>':'')+
  '<p id="aMsg" class="small" role="status" style="min-height:1em"></p>'+
  '<button class="btn" type="submit" id="aBtn">'+T[1]+'</button>'+
  (m==='login'?'<button class="link" type="button" data-a="authMode" data-v="reset" style="align-self:center">¿Olvidaste tu contraseña?</button>':'')+
  '</form>'+
  (m==='login'?'<p class="muted small" style="text-align:center">¿No tienes cuenta? <button class="link" data-a="authMode" data-v="register" style="color:var(--accent-fg)">Crear cuenta</button></p><p class="muted small" style="text-align:center">Si ya usas Mind Focus o PowerFit, entra con la misma cuenta.</p>'
   :'<p class="muted small" style="text-align:center"><button class="link" data-a="authMode" data-v="login" style="color:var(--accent-fg)">Volver a iniciar sesión</button></p>')+
 '</div>';
}
function vNoAccess(){ return '<div class="stack full" style="align-items:center;text-align:center;gap:14px">'+brandBig()+'<h2>Sin acceso</h2><p class="muted">Tu cuenta no tiene acceso a Lumen. Escríbenos a través de planificarproyectos.com.</p><button class="btn soft" data-a="logout">Cerrar sesión</button></div>'; }
function authErr(e){
 var c=(e&&e.code)||'';
 if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Correo o contraseña incorrectos.';
 if(c==='auth/email-already-in-use') return 'Ya existe una cuenta con ese correo. Inicia sesión.';
 if(c==='auth/weak-password') return 'La contraseña debe tener al menos 6 caracteres.';
 if(c==='auth/invalid-email'||c==='auth/missing-email') return 'Revisa que el correo esté bien escrito.';
 if(c==='auth/too-many-requests') return 'Demasiados intentos. Espera unos minutos e intenta de nuevo.';
 if(c==='auth/network-request-failed') return 'Sin conexión. Revisa tu internet.';
 return 'No se pudo completar. Intenta de nuevo.';
}
var RESET_URL='https://www.planificarproyectos.com/lumen/';
function authSubmit(){
 var m=U.authMode||'login', em=(document.getElementById('aEmail').value||'').trim(), msg=document.getElementById('aMsg'), btn=document.getElementById('aBtn');
 var p=document.getElementById('aPass'), p2=document.getElementById('aPass2'); U.authEmail=em;
 function show(t,ok){ msg.textContent=t; msg.style.color=ok?'var(--accent-fg)':'#E86A62'; }
 if(!em) return show('Escribe tu correo.');
 if(m==='register'&&p.value!==p2.value) return show('Las contraseñas no coinciden.');
 var label=btn.textContent; btn.disabled=true; btn.textContent='Un momento…'; if(m!=='reset') Cloud.loginPending=true;
 var job=m==='login'?Cloud.auth.signInWithEmailAndPassword(em,p.value)
  :m==='register'?Cloud.auth.createUserWithEmailAndPassword(em,p.value)
  :Cloud.auth.sendPasswordResetEmail(em,{url:RESET_URL});
 job.then(function(){ if(m==='reset'){ show('Te enviamos un correo para restablecer tu contraseña.',true); btn.disabled=false; btn.textContent=label; } })
  .catch(function(e){ Cloud.loginPending=false; show(authErr(e)); btn.disabled=false; btn.textContent=label; });
}

/* ---------- Render ---------- */
var TABS=[['home','Inicio','home'],['rosary','Rosario','rosary'],['hoy','Hoy','sun'],['bible','Biblia','book'],['me','Perfil','user']];
function render(){
 var nav=document.querySelector('nav.tabs');
 if(needAuth()||Cloud.noAccess){ nav.hidden=true; document.getElementById('app').innerHTML='<div class="wrap" style="padding-bottom:24px">'+(Cloud.noAccess?vNoAccess():vAuth())+'</div>'; Inst.show(); return; }
 nav.hidden=false;
 var v={home:vHome,rosary:vRosary,hoy:vHoy,bible:vBible,me:vMe}[U.tab]();
 document.getElementById('app').innerHTML='<div class="wrap">'+v+'</div>';
 document.getElementById('navIn').innerHTML=TABS.map(function(t){
  if(t[0]==='hoy') return '<button class="hoy" data-a="tab" data-v="hoy" aria-current="'+(U.tab==='hoy'?'page':'false')+'"><span>'+ic('sun',26,2.2)+'</span>Hoy</button>';
  return '<button class="'+(U.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'" aria-current="'+(U.tab===t[0]?'page':'false')+'">'+ic(t[2],22)+t[1]+'</button>'; }).join('');
 Inst.show();
 var bs=document.querySelectorAll('[data-a=say]'); for(var i=0;i<bs.length;i++){ var s=bs[i].querySelector('span'); if(s&&!bs[i].classList.contains('on')) bs[i].setAttribute('data-l',s.textContent); }
}
var tt; function toast(m,ms){ var t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(function(){ t.hidden=true; },ms||2200); }

function sayText(id){
 if(id==='frase') return HOY.frase+'. '+HOY.fraseRef;
 if(id==='ev') return HOY.evTitulo+'. '+HOY.evResumen;
 if(id==='ref') return HOY.refTitulo+'. '+HOY.refTexto;
 if(id==='test') return 'Paz y bien'+(S.name?', '+S.name:'')+'. Así sonará la lectura en voz alta.';
 if(id.indexOf('pr-')===0) return PR[id.slice(3)];
 if(id.indexOf('ros-')===0) return stepText(STEPS[+id.slice(4)]);
 return '';
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]'); if(!el) return; var a=el.getAttribute('data-a'), v=el.getAttribute('data-v');
 if(a==='tab'){ stopSpeak(); U.tab=v; U.confirmReset=false; render(); window.scrollTo(0,0); return; }
 if(a==='say'){ var id=el.getAttribute('data-id'); speak(sayText(id),id); return; }
 if(a==='done'){ var id2=el.getAttribute('data-id'); setDone(id2,!isDone(id2)); render(); return; }
 if(a==='htab'){ stopSpeak(); U.hoyTab=v; render(); return; }
 if(a==='evdone'){ setDone('evg',true); render(); toast('Evangelio marcado'); return; }
 if(a==='copy'){ var txt=HOY.frase+' ('+HOY.fraseRef+')';
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast('Frase copiada'); },function(){ toast(txt); }); } else toast(txt); return; }
 if(a==='rset'){ stopSpeak(); U.rosSet=v; render(); return; }
 if(a==='rnext'||a==='rprev'){
  var i=rosI(); i=a==='rnext'?Math.min(STEPS.length,i+1):Math.max(0,i-1); S.ros[rosKey()]=i;
  if(i>=STEPS.length){ setDone('ros',true); toast('Rosario completado'); }
  save(); stopSpeak(); render();
  if(S.guided&&i<STEPS.length) speak(stepText(STEPS[i]),'ros-'+i);
  return; }
 if(a==='rreset'){ S.ros[rosKey()]=0; save(); render(); return; }
 if(a==='authMode'){ U.authMode=v; render(); return; }
 if(a==='logout'){ stopSpeak(); if(Cloud.auth) Cloud.auth.signOut(); return; }
 if(a==='resetPass'){ if(Cloud.auth&&Cloud.user) Cloud.auth.sendPasswordResetEmail(Cloud.user.email,{url:RESET_URL}).then(function(){ toast('Te enviamos un correo a '+Cloud.user.email); },function(e){ toast(authErr(e)); }); return; }
 if(a==='instGo'){ var pr=Inst.prompt; if(!pr) return; pr.prompt(); (pr.userChoice||Promise.resolve({})).then(function(c){ if(c&&c.outcome==='accepted') Inst.prompt=null; else { try{ localStorage.setItem('lumen:installDismiss',Date.now()); }catch(x){} } Inst.show(); if(U.tab==='me') render(); }); return; }
 if(a==='instNo'){ try{ localStorage.setItem('lumen:installDismiss',Date.now()); }catch(x){} Inst.show(); return; }
 if(a==='book'){ toast(v+': lector disponible en la publicación'); return; }
 if(a==='mode'){ S.mode=v; applyTheme(); save(); render(); return; }
 if(a==='accent'){ S.accent=v; applyTheme(); save(); render(); return; }
 if(a==='reset'){ U.confirmReset=true; render(); return; }
 if(a==='resetNo'){ U.confirmReset=false; render(); return; }
 if(a==='resetYes'){ S.done={}; S.ros={}; save(); U.confirmReset=false; render(); toast('Datos borrados'); return; }
});
document.addEventListener('submit',function(e){ if(e.target.id==='authForm'){ e.preventDefault(); authSubmit(); } });
document.addEventListener('change',function(e){
 var a=e.target.getAttribute('data-a');
 if(a==='guided'){ S.guided=e.target.checked; save(); }
 if(a==='voice'){ S.voice=e.target.value; save(); }
 if(a==='rate'){ S.rate=parseFloat(e.target.value)||1; save(); }
 if(a==='name'){ S.name=e.target.value.trim().slice(0,40); save(); }
});
document.addEventListener('input',function(e){
 var a=e.target.getAttribute('data-a');
 if(a==='bq'){ U.q=e.target.value; var pos=e.target.selectionStart; render(); var n=document.getElementById('bq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } }
 if(a==='rate'){ var r=document.getElementById('rateV'); if(r) r.textContent=parseFloat(e.target.value).toFixed(1)+'×'; }
});

var h=(location.hash||'').slice(1); if(['home','rosary','hoy','bible','me'].indexOf(h)>=0) U.tab=h;
/* ---------- Bienvenida ---------- */
var splashT0=Date.now(), splashTimer=null;
function hideSplash(){ var el=document.getElementById('splash'); if(!el) return;
 clearTimeout(splashTimer); splashTimer=setTimeout(function(){ el.classList.add('out'); Inst.show(); }, Math.max(0,2300-(Date.now()-splashT0))); }
function playSplash(){ var el=document.getElementById('splash'); if(!el) return;
 el.classList.remove('out'); el.classList.add('replay'); void el.offsetWidth; el.classList.remove('replay'); splashT0=Date.now(); hideSplash(); }

/* ---------- Arranque ---------- */
Cloud.init(); render(); hideSplash();
if('serviceWorker' in navigator) window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();
</script>
</body>
</html>
